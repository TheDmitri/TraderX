<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body.dz-viewport {
      width: 1920px; height: 1080px;
      background: #08090c url('bg-preview.jpg') center/cover no-repeat;
    }
    @media (max-width: 1920px) {
      body.dz-viewport { transform: scale(calc(100vw / 1920)); transform-origin: top left; }
    }
  </style>
</head>
<body class="dz-viewport">

<!-- LedgerTabView — Banking transaction history + selection detail (mockup-aligned).
     Backdrop dz-c-08090CD1 = ~82% opaque — consistent translucent backdrop. -->
<div data-dz="panel" data-name="ledgerPanel"
     class="dz-xy-0-0 dz-wh-full dz-c-08090CD1 dz-noptr">

  <!-- ════════ TOP TOOLBAR : search + filter pills + export ════════ -->

  <!-- Search input (top-left) -->
  <input data-dz="editbox" data-name="ledgerSearchInput"
         data-style="TXInputField"
         data-bind="{{ ledgerSearch }}"
         data-two-way="1"
         class="dz-xy-2-2 dz-wh-20-5 dz-c-FE dz-tc-D8D2C0 dz-font-12 dz-exact-text" />

  <!-- Filter pills (centered) -->
  <div data-dz="grid" data-name="filterBar"
       class="dz-xy-24-2 dz-wh-48-5 dz-cols-5 dz-rows-1 dz-gap-3">
    <button data-dz="button" data-name="filterAllBtn"
            data-style="TXTab" data-on-click="OnFilterAll"
            class="dz-c-FE dz-tc-D4A44C dz-font-11 dz-exact-text dz-text-center dz-text-vc dz-bold">
      ALL
    </button>
    <button data-dz="button" data-name="filterDepositBtn"
            data-style="TXTab" data-on-click="OnFilterDeposit"
            class="dz-c-FE dz-tc-D8D2C0 dz-font-11 dz-exact-text dz-text-center dz-text-vc dz-bold">
      DEPOSITS
    </button>
    <button data-dz="button" data-name="filterWithdrawBtn"
            data-style="TXTab" data-on-click="OnFilterWithdraw"
            class="dz-c-FE dz-tc-D8D2C0 dz-font-11 dz-exact-text dz-text-center dz-text-vc dz-bold">
      WITHDRAWALS
    </button>
    <button data-dz="button" data-name="filterTransferBtn"
            data-style="TXTab" data-on-click="OnFilterTransfer"
            class="dz-c-FE dz-tc-D8D2C0 dz-font-11 dz-exact-text dz-text-center dz-text-vc dz-bold">
      TRANSFERS
    </button>
    <button data-dz="button" data-name="filterTraderBtn"
            data-style="TXTab" data-on-click="OnFilterTrader"
            class="dz-c-FE dz-tc-D8D2C0 dz-font-11 dz-exact-text dz-text-center dz-text-vc dz-bold">
      TRADER
    </button>
  </div>

  <!-- ════════ MAIN TABLE (left, ~70% width) ════════ -->

  <div data-dz="panel" data-name="tableWrap" data-style="TXCard"
       class="dz-xy-2-9 dz-wh-67-88 dz-c-FE dz-noptr">
    <!-- Table header -->
    <div data-dz="panel" data-name="tableHeader" data-style="TXSurface"
         class="dz-xy-0-0 dz-wh-100-5 dz-c-FE dz-noptr">
      <span data-dz="text" data-name="thDate"
            class="dz-xy-2-0 dz-wh-12-100 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text dz-text-vc dz-bold">
        DATE
      </span>
      <span data-dz="text" data-name="thType"
            class="dz-xy-15-0 dz-wh-40-100 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text dz-text-vc dz-bold">
        TYPE · COUNTERPARTY
      </span>
      <span data-dz="text" data-name="thAmount"
            class="dz-xy-65-0 dz-wh-15-100 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text dz-text-right dz-text-vc dz-bold">
        AMOUNT
      </span>
      <span data-dz="text" data-name="thBalance"
            class="dz-xy-82-0 dz-wh-15-100 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text dz-text-right dz-text-vc dz-bold">
        BALANCE
      </span>
    </div>

    <!-- Day-group header placeholder (visible only with data — here as a static example) -->
    <div data-dz="panel" data-name="dayGroup" data-style="TXSurface"
         class="dz-xy-0-5 dz-wh-100-4 dz-c-FE dz-noptr">
      <span data-dz="text" data-name="dayGroupLabel"
            class="dz-xy-2-0 dz-wh-60-100 dz-tc-6A6560 dz-font-10 dz-noptr dz-exact-text dz-text-vc dz-bold">
        TODAY · 2026-04-18
      </span>
    </div>

    <!-- Scrollable entries list -->
    <div data-dz="scroll" data-name="entriesScroll"
         class="dz-xy-0-9 dz-wh-100-91 dz-scroll-v">
      <div data-dz="grid" data-name="ledger_list"
           data-foreach="{{ _visibleEntries }}"
           data-template="txb-ledger-row"
           data-item="_inputEntry"
           class="dz-wh-100-32px dz-noptr dz-fit-v dz-cols-1 dz-rows-100 dz-gap-1"></div>

      <!-- Empty-state fallback (shown when _visibleEntries is empty) -->
      <span data-dz="text" data-name="ledgerEmpty"
            class="dz-xy-5-40 dz-wh-90-10 dz-tc-6A6560 dz-font-12 dz-noptr dz-exact-text dz-text-center dz-text-vc">
        No transactions yet
      </span>
    </div>
  </div>

  <!-- ════════ RIGHT DETAIL PANEL (~28% width) ════════ -->

  <div data-dz="panel" data-name="detailPanel" data-style="TXCardElevated"
       class="dz-xy-70-9 dz-wh-28-88 dz-c-FE dz-noptr">

    <!-- Header strip: amber accent -->
    <div data-dz="panel" data-name="detailHeader" data-style="TXWarningBox"
         class="dz-xy-0-0 dz-wh-100-16 dz-c-FE dz-noptr">
      <span data-dz="text" data-name="detailHeaderLabel"
            class="dz-xy-5-10 dz-wh-90-18 dz-tc-D4A44C dz-font-11 dz-noptr dz-exact-text dz-bold">
        TRANSACTION DETAIL
      </span>
      <span data-dz="text" data-name="detailAmount"
            data-bind="{{ selected_amount }}"
            class="dz-xy-5-30 dz-wh-90-45 dz-tc-D4A44C dz-font-32 dz-noptr dz-exact-text dz-bold">
        —
      </span>
      <span data-dz="text" data-name="detailSubtitle"
            data-bind="{{ selected_type }}"
            class="dz-xy-5-78 dz-wh-90-18 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text dz-bold">
        — · CONFIRMED
      </span>
    </div>

    <!-- Detail rows -->
    <span data-dz="text" data-name="detailIdLabel"
          class="dz-xy-5-19 dz-wh-40-2 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text">
      ID
    </span>
    <span data-dz="text" data-name="detailId"
          data-bind="{{ selected_id }}"
          class="dz-xy-5-21 dz-wh-90-3 dz-tc-6A6560 dz-font-11 dz-noptr dz-exact-text">
      —
    </span>

    <span data-dz="text" data-name="detailDateLabel"
          class="dz-xy-5-26 dz-wh-40-2 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text">
      DATE
    </span>
    <span data-dz="text" data-name="detailDate"
          data-bind="{{ selected_date }}"
          class="dz-xy-5-28 dz-wh-90-3 dz-tc-D8D2C0 dz-font-12 dz-noptr dz-exact-text">
      —
    </span>

    <span data-dz="text" data-name="detailTypeLabel"
          class="dz-xy-5-33 dz-wh-40-2 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text">
      TYPE
    </span>
    <span data-dz="text" data-name="detailType"
          data-bind="{{ selected_type }}"
          class="dz-xy-5-35 dz-wh-90-3 dz-tc-D8D2C0 dz-font-12 dz-noptr dz-exact-text">
      —
    </span>

    <span data-dz="text" data-name="detailPartyLabel"
          class="dz-xy-5-40 dz-wh-50-2 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text">
      COUNTERPARTY
    </span>
    <span data-dz="text" data-name="detailParty"
          data-bind="{{ selected_counterparty }}"
          class="dz-xy-5-42 dz-wh-90-3 dz-tc-D8D2C0 dz-font-12 dz-noptr dz-exact-text">
      —
    </span>

    <span data-dz="text" data-name="detailFeeLabel"
          class="dz-xy-5-47 dz-wh-40-2 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text">
      FEE
    </span>
    <span data-dz="text" data-name="detailFee"
          data-bind="{{ selected_fee }}"
          class="dz-xy-5-49 dz-wh-90-3 dz-tc-C8664A dz-font-12 dz-noptr dz-exact-text">
      —
    </span>

    <span data-dz="text" data-name="detailBalanceLabel"
          class="dz-xy-5-54 dz-wh-40-2 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text">
      BALANCE AFTER
    </span>
    <span data-dz="text" data-name="detailBalance"
          data-bind="{{ selected_balance }}"
          class="dz-xy-5-56 dz-wh-90-4 dz-tc-D4A44C dz-font-16 dz-noptr dz-exact-text dz-bold">
      —
    </span>

    <span data-dz="text" data-name="detailNoteLabel"
          class="dz-xy-5-65 dz-wh-40-2 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text">
      NOTE
    </span>
    <span data-dz="text" data-name="detailNote"
          data-bind="{{ selected_note }}"
          class="dz-xy-5-67 dz-wh-90-6 dz-tc-D8D2C0 dz-font-11 dz-noptr dz-exact-text dz-wrap">
      —
    </span>

    <!-- Confirmed alert -->
    <div data-dz="panel" data-name="confirmedAlert" data-style="TXSuccessBox"
         class="dz-xy-3-77 dz-wh-94-9 dz-c-FE dz-noptr">
      <span data-dz="text" data-name="confirmedTitle"
            class="dz-xy-4-15 dz-wh-90-35 dz-tc-9AB05A dz-font-11 dz-noptr dz-exact-text dz-bold">
        TRANSACTION CONFIRMED
      </span>
      <span data-dz="text" data-name="confirmedBody"
            class="dz-xy-4-55 dz-wh-92-35 dz-tc-9A9488 dz-font-10 dz-noptr dz-exact-text dz-wrap">
        Cleared on server · no dispute window.
      </span>
    </div>

    <!-- Copy ID / Receipt buttons at bottom -->
    <div data-dz="grid" data-name="detailActions"
         class="dz-xy-3-88 dz-wh-94-8 dz-cols-2 dz-rows-1 dz-gap-3">
      <button data-dz="button" data-name="copyTxIdBtn"
              data-style="TXBtnDefault"
              class="dz-c-FE dz-tc-D8D2C0 dz-font-11 dz-exact-text dz-bold">
        COPY ID
      </button>
      <button data-dz="button" data-name="receiptBtn"
              data-style="TXBtnDefault"
              class="dz-c-FE dz-tc-D8D2C0 dz-font-11 dz-exact-text dz-bold">
        RECEIPT
      </button>
    </div>
  </div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
