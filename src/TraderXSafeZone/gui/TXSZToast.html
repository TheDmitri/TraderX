<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<!-- TraderXSafeZone enter/exit toast — Field Ledger. Single reusable top-right
     card: shield glyph well + title + body, left accent rule recolored in code
     (olive = enter, rust = exit). Auto-hides via TXSZToastComponent.
     data-name contract → AutoLoadWidgets in TXSZToastComponent.c:
       toastRoot, leftRule, iconWell, shieldIcon, titleText, bodyText -->
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#0F1215;">

<div data-dz="panel" data-name="toastRoot" data-style="TXCardElevated"
    class="dz-xy-1572px-60px dz-wh-330px-92px dz-noptr dz-priority-999">

  <!-- Accent rule (recolored per transition in code) -->
  <div data-dz="panel" data-name="leftRule" class="dz-xy-0px-0px dz-wh-3px-92px dz-c-7a9a4a dz-noptr"></div>

  <!-- Icon well: dark surface + tinted shield glyph (loaded + recolored in code) -->
  <div data-dz="panel" data-name="iconWell" data-style="TXSurface" class="dz-xy-12px-12px dz-wh-44px-44px dz-noptr">
    <img data-dz="image" data-name="shieldIcon" class="dz-xy-10px-10px dz-wh-24px-24px dz-c-7a9a4a dz-noptr" />
  </div>

  <!-- Title -->
  <span data-dz="text" data-name="titleText" data-bind="{{ toastTitle }}"
      class="dz-xy-68px-14px dz-wh-250px-22px dz-noptr dz-c-d8d2c0 dz-font-body-16 dz-exact-text dz-text-vc">
    SafeZone
  </span>

  <!-- Body (multiline) -->
  <p data-dz="richtext" data-name="bodyText" data-bind="{{ toastBody }}"
      class="dz-xy-68px-40px dz-wh-250px-44px dz-noptr dz-c-9a9488 dz-font-body-14 dz-exact-text dz-wrap">
    You entered the safezone!
  </p>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
