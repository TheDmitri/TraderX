<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<!-- TraderXSafeZone leave countdown — Field Ledger. Single bound text line that
     ticks every second via DayZular TextBinding ({{ countdownText }}). Replaces
     the raw SafeZoneNotification.layout. Rust accent rule (leaving = inverse).
     data-name contract → AutoLoadWidgets in TXSZCountdownComponent.c:
       countdownRoot, leftRule, countdownLabel -->
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#0F1215;">

<div data-dz="panel" data-name="countdownRoot" data-style="TXCard"
    class="dz-xy-1572px-170px dz-wh-330px-40px dz-noptr dz-priority-999">

  <!-- Rust accent rule -->
  <div data-dz="panel" data-name="leftRule" class="dz-xy-0px-0px dz-wh-3px-40px dz-c-b0482a dz-noptr"></div>

  <!-- Countdown line -->
  <span data-dz="text" data-name="countdownLabel" data-bind="{{ countdownText }}"
      class="dz-xy-14px-0px dz-wh-308px-40px dz-noptr dz-c-d8d2c0 dz-font-body-14 dz-exact-text dz-text-vc dz-wrap">
    You are leaving the safezone in 30 seconds
  </span>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
