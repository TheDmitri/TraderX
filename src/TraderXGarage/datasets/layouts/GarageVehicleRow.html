<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml style="width:600px; height:84px; background:#13100c;">
<!-- Stored vehicle row (Nasdara): Surface card, health dot, name + state, badge in ember;
     ember ring when selected. Background button = selection; overlays are dz-noptr. -->
<div data-dz="panel" data-name="vehicleRowRoot" data-style="TXCard"
     class="dz-xy-0-0 dz-wh-100-84px dz-c-FE">
  <button data-dz="button" data-name="rowClickBtn" data-style="TXListRow"
          data-on-click="OnVehicleSelected"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel" data-name="rowSelectedBg" data-style="TXCardSelected"
       class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
  <div data-dz="panel" data-name="rowHealthBar"
       class="dz-xy-24px-0 dz-wh-10px-10px dz-align-y-center dz-c-7FA65A dz-noptr"></div>
  <span data-dz="text" data-name="rowName" data-bind="{{ rowName }}"
        class="dz-xy-52px-14px dz-wh-360px-28px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-text-vc">
    Vehicle
  </span>
  <span data-dz="text" data-name="rowHealth" data-bind="{{ rowHealth }}"
        class="dz-xy-52px-44px dz-wh-360px-24px dz-c-A39276 dz-font-nbb-17 dz-noptr dz-exact-text dz-text-vc">
    Pristine - Fuel 100%
  </span>
  <span data-dz="text" data-name="rowBadge" data-bind="{{ rowBadgeText }}"
        class="dz-xy-24px-0 dz-wh-200px-84px dz-align-x-right dz-c-E8894A dz-font-nm-14 dz-noptr dz-exact-text dz-text-right dz-text-vc">
  </span>
</div>
<script src="dzml-runtime.js"></script>
</body>
</html>
