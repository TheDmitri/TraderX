<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body>

<!-- GarageVehicleRow - one stored vehicle. Background button = selection; overlays are dz-noptr. -->
<div data-dz="panel" data-name="vehicleRowRoot" data-style="TXSurface"
     class="dz-xy-0-0 dz-wh-full dz-c-FE">
  <button data-dz="button" data-name="rowClickBtn" data-style="TXListRow"
          data-on-click="OnVehicleSelected"
          class="dz-xy-0-0 dz-wh-full dz-c-00000000"></button>
  <div data-dz="panel" data-name="rowSelectedBg"
       data-style="TXCardElevated" class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
  <div data-dz="panel" data-name="rowHealthBar"
       class="dz-xy-3-28 dz-wh-8px-8px dz-c-7A9A4A dz-noptr"></div>
  <span data-dz="text" data-name="rowName"
        data-bind="{{ rowName }}"
        class="dz-xy-6-10 dz-wh-60-45 dz-c-D8D2C0 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-bold">
    Vehicle
  </span>
  <span data-dz="text" data-name="rowHealth"
        data-bind="{{ rowHealth }}"
        class="dz-xy-6-55 dz-wh-60-35 dz-c-9A9488 dz-font-body-12 dz-noptr dz-exact-text dz-text-vc">
    Pristine - Fuel 100%
  </span>
  <span data-dz="text" data-name="rowBadge"
        data-bind="{{ rowBadgeText }}"
        class="dz-xy-66-0 dz-wh-31-100 dz-c-D4A44C dz-font-mono-11 dz-noptr dz-exact-text dz-text-right dz-text-vc dz-bold">
  </span>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
