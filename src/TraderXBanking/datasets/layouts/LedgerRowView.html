<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
</head>
<body class="dz-viewport" data-dzml style="width:624px; height:84px; background:#1c1813;">

<!-- Ledger row (Nasdara, board "Bank · Home"): sign box, type, date + balance, amount in
     Good / Bad (set in TXBLedgerRowComponent). -->
<div data-dz="panel" data-name="ledgerRowRoot" data-style="TXBRowRule"
     class="dz-xy-0-0 dz-wh-100-84px dz-c-FE dz-noptr">
  <button data-dz="button" data-name="rowClickBtn" data-style="TXBListRow" data-on-click="OnRowClicked"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel" data-name="rowSignBox" data-style="TXBInset"
       class="dz-xy-29px-0 dz-wh-43px-43px dz-align-y-center dz-c-FE dz-noptr">
    <span data-dz="text" data-name="rowSign" data-bind="{{ rowSignText }}"
          class="dz-xy-0-0 dz-wh-full dz-c-7FA65A dz-font-nm-22 dz-noptr dz-exact-text dz-text-center dz-text-vc">+</span>
  </div>
  <span data-dz="text" data-name="rowType" data-bind="{{ rowTypeText }}"
        class="dz-xy-89px-17px dz-wh-340px-26px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-text-vc">
    Deposit
  </span>
  <span data-dz="text" data-name="rowDate" data-bind="{{ rowDetailText }}"
        class="dz-xy-89px-45px dz-wh-340px-22px dz-c-A39276 dz-font-nbb-17 dz-noptr dz-exact-text dz-text-vc">
    10/23 14:02 · balance 1,000
  </span>
  <span data-dz="text" data-name="rowAmount" data-bind="{{ rowAmountText }}"
        class="dz-xy-29px-0 dz-wh-160px-84px dz-align-x-right dz-c-7FA65A dz-font-nm-22 dz-noptr dz-exact-text dz-text-right dz-text-vc">
    +1,000
  </span>
  <span data-dz="text" data-name="rowBalance" data-bind="{{ rowBalanceText }}"
        class="dz-xy-0-0 dz-wh-1px-1px dz-c-00000000 dz-noptr dz-hidden">500</span>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
