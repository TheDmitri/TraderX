<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <style>
    /* Preview viewport - fixed 16:9 ratio with DayZ background */
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body.dz-viewport {
      width: 1920px; height: 1080px;
      background: #1a1a1a url('bg-preview.jpg') center/cover no-repeat;
      position: relative;
    }
    /* Scale to fit browser window */
    @media (max-width: 1920px) {
      body.dz-viewport {
        transform: scale(calc(100vw / 1920));
        transform-origin: top left;
      }
    }
  </style>

  <!-- Field Ledger design system - shared with TraderX main, see docs/TraderX_Design_System.md -->
  <style type="dz-styles">
    /* Containers & surfaces */
    .TXContainer      { --bg: #08090c; --border: #252a36; }
    .TXHeader         { --bg: #0c0e14; --bottom: #1a1e28; }
    .TXCard           { --bg: #10131b; --border: #1a1e28; }
    .TXCardElevated   { --bg: #161a24; --border: #3a4050; }
    .TXSurface        { --bg: #0c0e14; --border: #1a1e28; }
    .TXDivider        { --bg: #1a1e28; }

    /* Tabs - amber underline on active */
    .TXTab {
      --type: button; --bg: #0c0e14;
      --highlight-bg: #12151c; --highlight-bottom: #d4a44c;
      --pushed-bg: #08090e;    --pushed-bottom: #d4a44c;
    }

    /* Buttons - olive primary, amber accent, rust danger, neutral default, blood leave */
    .TXBtnPrimary { --type: button; --bg: #2a3a1a; --border: #4a6a2a;
                    --highlight-bg: #3a5022; --pushed-bg: #1f2a12; }
    .TXBtnAccent  { --type: button; --bg: #2a2214; --border: #8a6a30;
                    --highlight-bg: #3a2e1a; --pushed-bg: #1d180e; }
    .TXBtnDanger  { --type: button; --bg: #2a1410; --border: #7a2a18;
                    --highlight-bg: #3a1a14; --pushed-bg: #1a0c08; }
    .TXBtnDefault { --type: button; --bg: #14161e; --border: #252a36;
                    --highlight-bg: #1a1e28; --pushed-bg: #0e1018; }
    .TXBtnLeave   { --type: button; --bg: #8B0000;
                    --highlight-bg: #a52a2a; --pushed-bg: #6B0000; }

    /* Inputs - amber focus border */
    .TXInputField { --type: editbox; --bg: #14161e; --border: #252a36;
                    --focus-bg: #1a1e28; --focus-border: #d4a44c; }

    /* Progress - amber fill */
    .TXProgressBg   { --bg: #14161e; --radius: 3; }
    .TXProgressFill { --bg: #d4a44c; --radius: 3; }

    /* Status boxes - left accent strip per sentiment */
    .TXInfoBox    { --bg: #10121a; --left: #4a7ac7; }
    .TXSuccessBox { --bg: #10121a; --left: #7a9a4a; }
    .TXWarningBox { --bg: #10121a; --left: #d4a44c; }
    .TXErrorBox   { --bg: #10121a; --left: #c93030; }

    /* List rows */
    .TXListRow         { --type: button; --bg: #0a0c12;
                         --highlight-bg: #12141c; --pushed-bg: #0e1018; }
    .TXListRowAlt      { --type: button; --bg: #0d0f16;
                         --highlight-bg: #12141c; --pushed-bg: #0e1018; }
    .TXListRowSelected { --type: button; --bg: #14161e; --left: #d4a44c;
                         --highlight-bg: #14161e; --highlight-left: #d4a44c;
                         --pushed-bg: #14161e;    --pushed-left: #d4a44c; }

    .TXBadge { --bg: #14161e; --radius: 3; }
  </style>
</head>
<body class="dz-viewport">

<!-- BankingPageView - Field Ledger shell (96x92 root, identity left, tabs centered, close right). -->
<div data-dz="frame" data-name="rootFrame" class="dz-xy-0-0 dz-wh-full dz-align-cc">
  <div data-dz="panel" data-name="bankingRoot" data-style="TXContainer"
       class="dz-xy-0-0 dz-wh-96-92 dz-align-cc dz-c-CC">

    <!-- ====== HEADER : identity + tabs + close ====== -->
    <div data-dz="panel" data-name="headerBar" data-style="TXHeader"
         class="dz-xy-0-0 dz-wh-100-9 dz-c-FE dz-noptr">

      <!-- Identity (NPC name + role) -->
      <div data-dz="panel" data-name="identityPanel"
           class="dz-xy-2-0 dz-wh-22-100 dz-noptr">
        <span data-dz="text" data-name="bankerName"
              data-bind="{{ bankerName }}"
              class="dz-xy-0-15 dz-wh-100-45 dz-tc-D4A44C dz-font-heading-28 dz-noptr dz-exact-text dz-bold">
          Banker
        </span>
        <span data-dz="text" data-name="bankerRole"
              class="dz-xy-0-60 dz-wh-100-30 dz-tc-9A9488 dz-font-body-12 dz-noptr dz-exact-text">
          BANKING - BANK TELLER
        </span>
      </div>

      <!-- Tab Navigation centered - 5 tabs: Home - Account - Vault - Transfer - Ledger -->
      <div data-dz="grid" data-name="tabNavGrid"
           class="dz-xy-22-25 dz-wh-70-50 dz-noptr dz-cols-5 dz-rows-1 dz-gap-4">
        <button data-dz="button" data-name="tabHome"
                data-style="TXTab"
                data-nav-target="banking-home-tab"
                class="dz-c-FE dz-tc-D8D2C0 dz-font-body-14 dz-exact-text dz-bold">
          HOME
        </button>
        <button data-dz="button" data-name="tabAccount"
                data-style="TXTab"
                data-nav-target="banking-account-tab"
                class="dz-c-FE dz-tc-D8D2C0 dz-font-body-14 dz-exact-text dz-bold">
          ACCOUNT
        </button>
        <button data-dz="button" data-name="tabVault"
                data-style="TXTab"
                data-nav-target="banking-vault-tab"
                class="dz-c-FE dz-tc-D8D2C0 dz-font-body-14 dz-exact-text dz-bold">
          VAULT
        </button>
        <button data-dz="button" data-name="tabTransfer"
                data-style="TXTab"
                data-nav-target="banking-transfer-tab"
                class="dz-c-FE dz-tc-D8D2C0 dz-font-body-14 dz-exact-text dz-bold">
          TRANSFER
        </button>
        <button data-dz="button" data-name="tabLedger"
                data-style="TXTab"
                data-nav-target="txb-ledger-tab"
                class="dz-c-FE dz-tc-D8D2C0 dz-font-body-14 dz-exact-text dz-bold">
          LEDGER
        </button>
      </div>

      <!-- Close button (Leave) -->
      <button data-dz="button" data-name="tabLeave"
              data-style="TXBtnLeave"
              data-on-click="OnClose"
              class="dz-xy-95-25 dz-wh-3-50 dz-c-FE dz-tc-FFFFFF dz-font-body-22 dz-exact-text dz-bold">
        X
      </button>
    </div>

    <!-- ====== SUBNAV : context info (online pill + fee pill on the right) ====== -->
    <div data-dz="panel" data-name="subnav" data-style="TXSurface"
         class="dz-xy-0-9 dz-wh-100-3.5 dz-c-FE dz-noptr">
      <span data-dz="text" data-name="subnavLeft"
            data-bind="{{ subnavContext }}"
            class="dz-xy-2-0 dz-wh-60-100 dz-tc-9A9488 dz-font-body-12 dz-noptr dz-exact-text dz-text-vc">
        SVETLOYARSK - CENTRAL BANK BRANCH
      </span>
      <!-- Online pill -->
      <div data-dz="panel" data-name="onlinePill" data-style="TXSuccessBox"
           class="dz-xy-86-20 dz-wh-5-60 dz-c-FE dz-noptr">
        <span data-dz="text" data-name="onlinePillText"
              class="dz-xy-0-0 dz-wh-100-100 dz-tc-9AB05A dz-font-body-12 dz-noptr dz-exact-text dz-text-center dz-text-vc dz-bold">
          ONLINE
        </span>
      </div>
      <!-- Fee pill -->
      <div data-dz="panel" data-name="feePill" data-style="TXCardElevated"
           class="dz-xy-92-20 dz-wh-5-60 dz-c-FE dz-noptr">
        <span data-dz="text" data-name="feePillText"
              data-bind="{{ feesText }}"
              class="dz-xy-0-0 dz-wh-100-100 dz-tc-9A9488 dz-font-body-12 dz-noptr dz-exact-text dz-text-center dz-text-vc dz-bold">
          FEE 2%
        </span>
      </div>
    </div>

    <!-- Tab Divider -->
    <div data-dz="panel" data-name="tabDivider" data-style="TXDivider"
         class="dz-xy-0-12.5 dz-wh-100-0.3 dz-c-FE dz-noptr"></div>

    <!-- Dynamic Tab Content -->
    <div data-dz="panel" data-name="tabContent"
         data-component="{{ current_tab }}"
         class="dz-xy-0-13 dz-wh-100-83 dz-clip">
    </div>

    <!-- ====== FOOTER : DayZ Beans Launcher promo (click to open modal) ====== -->
    <div data-dz="panel" data-name="footerBar" data-style="TXSurface"
         class="dz-xy-0-96 dz-wh-100-4 dz-c-FE">
      <button data-dz="button" data-name="footerLauncherBtn" data-on-click="OnLauncher"
              class="dz-xy-0-0 dz-wh-100-100 dz-c-00000000"></button>
      <span data-dz="text" data-name="footerSponsorText"
            class="dz-xy-36-0 dz-wh-16-100 dz-c-6A6560 dz-font-body-12 dz-noptr dz-exact-text dz-text-vc dz-text-right">
        Sponsored by
      </span>
      <span data-dz="text" data-name="footerBrandText"
            class="dz-xy-53-0 dz-wh-14-100 dz-c-D4A44C dz-font-body-12 dz-noptr dz-exact-text dz-text-vc dz-bold">
        DayZ Beans Launcher
      </span>
    </div>
  </div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
