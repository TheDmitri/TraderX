<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <style>
    /* Preview viewport - fixed 16:9 ratio with DayZ background */
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body.dz-viewport {
      width: 1920px; height: 1080px;
      background: #1a1a1a url('bg-preview.jpg') center/cover no-repeat;
      position: relative;
    }
    /* Scale to fit browser window */
    @media (max-width: 1920px) {
      body.dz-viewport {
        transform: scale(calc(100vw / 1920));
        transform-origin: top left;
      }
    }
  </style>

  <!-- Field Ledger design system - shared with TraderX main, see docs/TraderX_Design_System.md -->
  <style type="dz-styles">
    /* Containers & surfaces */
    .TXContainer      { --bg: #08090c; --border: #252a36; }
    .TXHeader         { --bg: #0c0e14; --bottom: #1a1e28; }
    .TXCard           { --bg: #10131b; --border: #1a1e28; }
    .TXCardElevated   { --bg: #161a24; --border: #3a4050; }
    .TXSurface        { --bg: #0c0e14; --border: #1a1e28; }
    .TXDivider        { --bg: #1a1e28; }

    /* Tabs - amber underline on active */
    .TXTab {
      --type: button; --bg: #0c0e14;
      --highlight-bg: #12151c; --highlight-bottom: #d4a44c;
      --pushed-bg: #08090e;    --pushed-bottom: #d4a44c;
    }

    /* Buttons - olive primary, amber accent, rust danger, neutral default, blood leave */
    .TXBtnPrimary { --type: button; --bg: #2a3a1a; --border: #4a6a2a;
                    --highlight-bg: #3a5022; --pushed-bg: #1f2a12; }
    .TXBtnAccent  { --type: button; --bg: #2a2214; --border: #8a6a30;
                    --highlight-bg: #3a2e1a; --pushed-bg: #1d180e; }
    .TXBtnDanger  { --type: button; --bg: #2a1410; --border: #7a2a18;
                    --highlight-bg: #3a1a14; --pushed-bg: #1a0c08; }
    .TXBtnDefault { --type: button; --bg: #14161e; --border: #252a36;
                    --highlight-bg: #1a1e28; --pushed-bg: #0e1018; }
    .TXBtnLeave   { --type: button; --bg: #8B0000;
                    --highlight-bg: #a52a2a; --pushed-bg: #6B0000; }

    /* Inputs - amber focus border */
    .TXInputField { --type: editbox; --bg: #14161e; --border: #252a36;
                    --focus-bg: #1a1e28; --focus-border: #d4a44c; }

    /* Progress - amber fill */
    .TXProgressBg   { --bg: #14161e; --radius: 3; }
    .TXProgressFill { --bg: #d4a44c; --radius: 3; }

    /* Status boxes - left accent strip per sentiment */
    .TXInfoBox    { --bg: #10121a; --left: #4a7ac7; }
    .TXSuccessBox { --bg: #10121a; --left: #7a9a4a; }
    .TXWarningBox { --bg: #10121a; --left: #d4a44c; }
    .TXErrorBox   { --bg: #10121a; --left: #c93030; }

    /* List rows */
    .TXListRow         { --type: button; --bg: #0a0c12;
                         --highlight-bg: #12141c; --pushed-bg: #0e1018; }
    .TXListRowAlt      { --type: button; --bg: #0d0f16;
                         --highlight-bg: #12141c; --pushed-bg: #0e1018; }
    .TXListRowSelected { --type: button; --bg: #14161e; --left: #d4a44c;
                         --highlight-bg: #14161e; --highlight-left: #d4a44c;
                         --pushed-bg: #14161e;    --pushed-left: #d4a44c; }

    .TXBadge { --bg: #14161e; --radius: 3; }
  </style>
</head>
<body class="dz-viewport">

<!-- Bank shell (Nasdara, board "Bank · Home"): full screen, header 82 px with the bank
     identity, five tabs (ember underline on the active one), ONLINE + close; tab content;
     DayZ Beans Launcher footer strip. -->
<div data-dz="frame" data-name="rootFrame" class="dz-xy-0-0 dz-wh-full dz-align-cc">
  <div data-dz="panel" data-name="bankingRoot" class="dz-xy-0-0 dz-wh-full dz-c-13100C">
    <div data-dz="panel" data-name="bankingRootBg" class="dz-xy-0-0 dz-wh-full dz-c-13100C dz-noptr"></div>

    <!-- HEADER -->
    <div data-dz="panel" data-name="headerBar" data-style="TXBHeader"
         class="dz-xy-0-0 dz-wh-100-82px dz-c-FE dz-noptr">
      <div data-dz="panel" data-name="identityPanel" class="dz-xy-29px-0 dz-wh-400px-82px dz-noptr">
        <div data-dz="panel" data-name="bankIconBox" data-style="TXBIcon"
             class="dz-xy-0-0 dz-wh-48px-48px dz-align-y-center dz-c-FE dz-noptr">
          <img data-dz="image" data-name="bankIcon"
               class="dz-xy-0-0 dz-wh-27px-27px dz-align-cc dz-c-1A0D04 dz-noptr"
               data-image="set:traderx_icons image:bank"
               data-image-mode="blend" data-image-src-alpha="1" data-image-stretch="stretch_w_h"/>
        </div>
        <span data-dz="text" data-name="bankerName" data-bind="{{ bankerName }}"
              class="dz-xy-65px-11px dz-wh-330px-42px dz-c-F2E9D8 dz-font-nh-29 dz-noptr dz-exact-text dz-text-vc">
          BANK
        </span>
        <span data-dz="text" data-name="bankerRole" data-bind="{{ bankerRole }}"
              class="dz-xy-65px-50px dz-wh-330px-18px dz-c-A39276 dz-font-nb-16 dz-noptr dz-exact-text dz-text-vc">
          TELLER
        </span>
      </div>

      <div data-dz="grid" data-name="tabNavGrid"
           class="dz-xy-0-0 dz-wh-750px-82px dz-align-x-center dz-cols-5 dz-rows-1 dz-gap-5">
      <div data-dz="panel" data-name="tabHomeCell" class="dz-wh-146px-82px dz-noptr">
        <button data-dz="button" data-name="tabHome" data-style="Empty" data-nav-target="banking-home-tab"
                class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text" data-name="tabHomeLabel"
              class="dz-xy-0-0 dz-wh-full dz-c-A39276 dz-font-nh-20 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          HOME
        </span>
        <div data-dz="panel" data-name="homeLine"
             class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
      <div data-dz="panel" data-name="tabAccountCell" class="dz-wh-146px-82px dz-noptr">
        <button data-dz="button" data-name="tabAccount" data-style="Empty" data-nav-target="banking-account-tab"
                class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text" data-name="tabAccountLabel"
              class="dz-xy-0-0 dz-wh-full dz-c-A39276 dz-font-nh-20 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          ACCOUNT
        </span>
        <div data-dz="panel" data-name="accountLine"
             class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
      <div data-dz="panel" data-name="tabVaultCell" class="dz-wh-146px-82px dz-noptr">
        <button data-dz="button" data-name="tabVault" data-style="Empty" data-nav-target="banking-vault-tab"
                class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text" data-name="tabVaultLabel"
              class="dz-xy-0-0 dz-wh-full dz-c-A39276 dz-font-nh-20 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          VAULT
        </span>
        <div data-dz="panel" data-name="vaultLine"
             class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
      <div data-dz="panel" data-name="tabTransferCell" class="dz-wh-146px-82px dz-noptr">
        <button data-dz="button" data-name="tabTransfer" data-style="Empty" data-nav-target="banking-transfer-tab"
                class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text" data-name="tabTransferLabel"
              class="dz-xy-0-0 dz-wh-full dz-c-A39276 dz-font-nh-20 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          TRANSFER
        </span>
        <div data-dz="panel" data-name="transferLine"
             class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
      <div data-dz="panel" data-name="tabLedgerCell" class="dz-wh-146px-82px dz-noptr">
        <button data-dz="button" data-name="tabLedger" data-style="Empty" data-nav-target="txb-ledger-tab"
                class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text" data-name="tabLedgerLabel"
              class="dz-xy-0-0 dz-wh-full dz-c-A39276 dz-font-nh-20 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          LEDGER
        </span>
        <div data-dz="panel" data-name="ledgerLine"
             class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
      </div>

      <div data-dz="panel" data-name="closeHost" class="dz-xy-29px-0 dz-wh-53px-53px dz-align-cr dz-noptr">
        <button data-dz="button" data-name="tabLeave" data-style="TXBBtnLeave" data-on-click="OnClose"
                class="dz-xy-0-0 dz-wh-full dz-tc-FE">
          <img data-dz="image" data-name="tabLeaveIcon"
               class="dz-xy-0-0 dz-wh-20px-20px dz-align-cc dz-c-C2B59C dz-noptr"
               data-image="set:traderx_icons image:close"
               data-image-mode="blend" data-image-src-alpha="1" data-image-stretch="stretch_w_h"/>
        </button>
      </div>
      <div data-dz="panel" data-name="onlinePill" data-style="TXBFrame"
           class="dz-xy-94px-0 dz-wh-120px-36px dz-align-cr dz-c-FE dz-noptr">
        <div data-dz="panel" data-name="onlineDot" class="dz-xy-14px-0 dz-wh-10px-10px dz-align-y-center dz-c-7FA65A dz-noptr"></div>
        <span data-dz="text" data-name="onlinePillText"
              class="dz-xy-32px-0 dz-wh-80px-36px dz-c-7FA65A dz-font-nbb-16 dz-noptr dz-exact-text dz-text-vc">
          ONLINE
        </span>
      </div>
    </div>

    <!-- CONTENT -->
    <div data-dz="panel" data-name="tabContent" data-component="{{ current_tab }}"
         class="dz-xy-0-82px dz-wh-100-950px dz-clip"></div>

    <!-- FOOTER: DayZ Beans Launcher strip (click opens the promo) -->
    <div data-dz="panel" data-name="footerBar" data-style="TXBFooter"
         class="dz-align-bc dz-wh-100-48px dz-c-FE">
      <button data-dz="button" data-name="footerLauncherBtn" data-style="Empty" data-on-click="OnLauncher"
              class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
      <img data-dz="image" data-name="footerCan"
           class="dz-xy-24px-0 dz-wh-32px-32px dz-align-y-center dz-c-FF dz-noptr"
           data-image="TraderX/datasets/images/beans_can.edds"
           data-image-mode="blend" data-image-src-alpha="1" data-image-stretch="stretch_w_h"/>
      <div data-dz="wrap" data-name="footerPromoRow" class="dz-xy-62px-0 dz-wh-1100px-48px dz-noptr">
        <span data-dz="text" data-name="footerSponsorText"
              class="dz-wh-1px-48px dz-c-C2B59C dz-font-nb-17 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
          #txb_beans_playing_with
        </span>
        <span data-dz="text" data-name="footerBrandText"
              class="dz-wh-1px-48px dz-c-F2E9D8 dz-font-nbb-17 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
          DayZ Beans Launcher
        </span>
        <span data-dz="text" data-name="footerTagline"
              class="dz-wh-1px-48px dz-c-C2B59C dz-font-nb-17 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
          #txb_beans_tagline
        </span>
      </div>
      <span data-dz="text" data-name="footerHints"
            class="dz-xy-29px-0 dz-wh-400px-48px dz-align-x-right dz-c-A39276 dz-font-nb-16 dz-noptr dz-exact-text dz-text-right dz-text-vc">
        #txb_footer_esc_close
      </span>
    </div>
  </div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
