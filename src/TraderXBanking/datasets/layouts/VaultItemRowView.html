<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
</head>
<body>

<!-- VaultItemRowView - single slot in the storage grid.
     Clickable button overlay fires selection event. Health dot, qty badge,
     depositor tag (clan only), footprint tag, item name. -->
<div data-dz="panel" data-name="vaultSlotRoot" data-style="TXBSurface"
     class="dz-xy-0-0 dz-wh-full dz-c-FE">

  <!-- Click overlay (covers entire slot) -->
  <button data-dz="button" data-name="slotClickBtn"
          data-on-click="OnSlotClicked"
          class="dz-xy-0-0 dz-wh-full dz-c-00000000"></button>

  <!-- Health dot (top-left) -->
  <div data-dz="panel" data-name="slotHealth"
       data-bind-style="{{ healthStyleRef }}"
       class="dz-xy-5-5 dz-wh-12-12 dz-noptr"></div>

  <!-- Quantity badge (top-right, only when qty > 1) -->
  <span data-dz="text" data-name="slotQty"
        data-bind="{{ qtyText }}"
        class="dz-xy-70-5 dz-wh-25-12 dz-c-E8894A dz-font-nbb-16 dz-noptr dz-exact-text dz-text-right">
    -
  </span>

  <!-- Depositor tag (clan only, below qty) -->
  <span data-dz="text" data-name="slotDepositor"
        data-bind="{{ depositorInitials }}"
        class="dz-xy-70-20 dz-wh-25-12 dz-c-8C7D66 dz-font-nbb-16 dz-noptr dz-exact-text dz-text-right">
    -
  </span>

  <!-- Footprint badge (bottom-right) -->
  <span data-dz="text" data-name="slotFootprint"
        data-bind="{{ footprintText }}"
        class="dz-xy-65-82 dz-wh-30-10 dz-c-8C7D66 dz-font-nbb-16 dz-noptr dz-exact-text dz-text-right">
    -
  </span>

  <!-- Item name (bottom-left, wraps) -->
  <span data-dz="text" data-name="slotName"
        data-bind="{{ displayName }}"
        class="dz-xy-5-72 dz-wh-60-22 dz-c-F2E9D8 dz-font-nbb-16 dz-noptr dz-exact-text dz-wrap">
    -
  </span>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
