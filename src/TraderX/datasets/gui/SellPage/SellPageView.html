<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:950px; background:#13100c;">

<!-- Sell page (Nasdara, same frame as "Trader · Purchase"): sidebar 312 px with search,
     the inventory slot to sell from, sell mode and quantity; your items in the middle;
     the sale (tx-checkout in SELL mode) 456 px on the right. -->
<div data-dz="panel"
    data-name="SellPageView"
    class="dz-xy-0-0 dz-wh-full dz-c-13100C dz-noptr">

  <!-- Sidebar -->
  <div data-dz="panel"
      data-name="SellSidebar"
      data-style="TXSideLeft"
      class="dz-xy-0-0 dz-wh-312px-950px dz-c-FE dz-noptr">
    <span data-dz="text"
        data-name="searchLabel"
        class="dz-xy-24px-24px dz-wh-264px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
      #tpm_search_caps
    </span>
    <div data-dz="panel"
        data-name="SearchBarHost"
        data-component="tx-search-bar"
        class="dz-xy-24px-50px dz-wh-264px-48px"></div>
    <span data-dz="text"
        data-name="sellFromLabel"
        class="dz-xy-24px-122px dz-wh-264px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
      #tpm_sell_from_caps
    </span>
    <div data-dz="panel"
        data-name="PlayerSlotHost"
        data-component="tx-player-slot-nav"
        class="dz-xy-24px-150px dz-wh-264px-210px"></div>
    <span data-dz="text"
        data-name="modeLabel"
        class="dz-xy-24px-384px dz-wh-264px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
      #tpm_sell_mode_caps
    </span>
    <div data-dz="panel"
        data-name="selectItemsBtnHost"
        class="dz-xy-24px-410px dz-wh-264px-48px dz-noptr">
      <button data-dz="button"
          data-name="selectItemsBtn"
          data-style="TXBtnDefault"
          data-on-click="OnSelectItemsClick"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
      <span data-dz="text"
          data-name="selectItemsBtnText"
          class="dz-xy-17px-0 dz-wh-170px-48px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vc">
        #tpm_select_items
      </span>
      <div data-dz="panel"
          data-name="selectItemsBtnRing"
          data-style="TXCardSelected"
          class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr dz-hidden"></div>
    </div>
    <div data-dz="panel"
        data-name="entireContainerBtnHost"
        class="dz-xy-24px-464px dz-wh-264px-48px dz-noptr">
      <button data-dz="button"
          data-name="entireContainerBtn"
          data-style="TXBtnDefault"
          data-on-click="OnSellEntireContainerClick"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
      <span data-dz="text"
          data-name="entireContainerBtnText"
          class="dz-xy-17px-0 dz-wh-170px-48px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vc">
        #tpm_sell_container
      </span>
      <div data-dz="panel"
          data-name="entireContainerBtnRing"
          data-style="TXCardSelected"
          class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr dz-hidden"></div>
    </div>
    <span data-dz="text"
        data-name="qtyLabel"
        class="dz-xy-24px-536px dz-wh-264px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
      #tpm_quantity_caps
    </span>
    <div data-dz="panel"
        data-name="qtyMinBtnHost"
        class="dz-xy-24px-562px dz-wh-264px-48px dz-noptr">
      <button data-dz="button"
          data-name="qtyMinBtn"
          data-style="TXBtnDefault"
          data-on-click="OnQtyMinClick"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
      <span data-dz="text"
          data-name="qtyMinBtnText"
          class="dz-xy-17px-0 dz-wh-170px-48px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vc">
        #tpm_minimal_quantity
      </span>
      <span data-dz="text"
          data-name="qtyMinBtnValue"
          data-bind="{{ minimal_quantity }}"
          class="dz-xy-17px-0 dz-wh-90px-48px dz-align-x-right dz-c-C2B59C dz-font-nm-17 dz-noptr dz-exact-text dz-text-right dz-text-vc">
        60
      </span>
      <div data-dz="panel"
          data-name="qtyMinBtnRing"
          data-style="TXCardSelected"
          class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr dz-hidden"></div>
    </div>
    <div data-dz="panel"
        data-name="qtyAllBtnHost"
        class="dz-xy-24px-616px dz-wh-264px-48px dz-noptr">
      <button data-dz="button"
          data-name="qtyAllBtn"
          data-style="TXBtnDefault"
          data-on-click="OnQtyAllClick"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
      <span data-dz="text"
          data-name="qtyAllBtnText"
          class="dz-xy-17px-0 dz-wh-170px-48px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vc">
        #tpm_maximal_quantity
      </span>
      <span data-dz="text"
          data-name="qtyAllBtnValue"
          data-bind="{{ total_quantity }}"
          class="dz-xy-17px-0 dz-wh-90px-48px dz-align-x-right dz-c-C2B59C dz-font-nm-17 dz-noptr dz-exact-text dz-text-right dz-text-vc">
        60
      </span>
      <div data-dz="panel"
          data-name="qtyAllBtnRing"
          data-style="TXCardSelected"
          class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr dz-hidden"></div>
    </div>
  </div>

  <!-- Main: items in the selected slot -->
  <div data-dz="wrap"
      data-name="sellTitleRow"
      class="dz-xy-341px-24px dz-wh-800px-60px dz-noptr dz-gap-19">
    <span data-dz="text"
        data-name="sellTitle"
        class="dz-wh-1px-57px dz-c-F2E9D8 dz-font-nh-41 dz-noptr dz-exact-text dz-text-vb dz-size-to-text-h">
      #tpm_your_items_caps
    </span>
    <span data-dz="text"
        data-name="containerTitle"
        class="dz-wh-1px-54px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vb dz-size-to-text-h">
      #tpm_select_container_to_sell
    </span>
  </div>
  <div data-dz="panel"
      data-name="ViewToggleHost"
      data-component="tx-view-toggle"
      class="dz-xy-485px-28px dz-wh-96px-41px dz-align-x-right dz-noptr"></div>
  <div data-dz="scroll"
      data-name="scrollSell"
      class="dz-xy-341px-96px dz-wh-1094px-830px dz-scroll-v">
    <div data-dz="grid"
        data-name="sellGridList"
        data-foreach="{{ _inputSellProducts }}"
        data-template="tx-item-card-small"
        data-item="_inputProduct"
        class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100 dz-gap-5"></div>
    <div data-dz="grid"
        data-name="sellGridTiles"
        data-foreach="{{ _inputSellProducts }}"
        data-template="tx-item-card-large"
        data-item="_inputProduct"
        class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-4 dz-rows-100 dz-gap-17"></div>
  </div>

  <!-- Sale -->
  <div data-dz="panel"
      data-name="CheckoutHost"
      data-component="tx-checkout"
      class="dz-xy-0-0 dz-wh-456px-950px dz-align-x-right"></div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
