<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="SellPageView"
    data-style="TXContent"
    class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr">
  <div data-dz="panel"
      data-name="topBar"
      data-style="TXSurface"
      class="dz-xy-0-0 dz-wh-100-6 dz-c-FE dz-noptr">
    <div data-dz="panel"
        data-name="SearchBarHost"
        data-component="tx-search-bar"
        class="dz-xy-36-22 dz-wh-26-56"></div>
    <div data-dz="panel"
        data-name="ViewToggleHost"
        data-component="tx-view-toggle"
        class="dz-xy-64-22 dz-wh-8-56 dz-noptr"></div>
  </div>
  <div data-dz="panel"
      data-name="ContainerListPanel"
      data-style="TXSurface"
      class="dz-xy-0-7 dz-wh-70-92 dz-c-FE dz-noptr">
    <div data-dz="panel"
      data-name="PlayerSlotHost"
      data-style="TXSurface"
      data-component="tx-player-slot-nav"
      class="dz-xy-0-0 dz-wh-100-7 dz-c-FE"></div>
    <span data-dz="text"
        data-name="containerTitle"
        class="dz-xy-1-9 dz-wh-60-5 dz-tc-9A9488 dz-font-body-14 dz-noptr dz-exact-text">
      #tpm_select_container_to_sell
    </span>
    <div data-dz="scroll"
        data-name="scrollSell"
        class="dz-xy-1-14 dz-wh-98-85 dz-noptr dz-scroll-v">
      <div data-dz="grid"
          data-name="sellGridList"
          data-foreach="{{ _inputSellProducts }}"
          data-template="tx-item-card-small"
          data-item="_inputProduct"
          class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100 dz-gap-6"></div>
      <div data-dz="grid"
          data-name="sellGridTiles"
          data-foreach="{{ _inputSellProducts }}"
          data-template="tx-item-card-large"
          data-item="_inputProduct"
          class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-3 dz-rows-100 dz-gap-6"></div>
    </div>
  </div>
  <div data-dz="panel"
      data-name="SellOptionsPanel"
      data-style="TXCard"
      class="dz-xy-71-7 dz-wh-28-92 dz-c-FE dz-noptr">
    <span data-dz="text"
        data-name="optionsTitle"
        class="dz-xy-0-1 dz-wh-100-4 dz-tc-D8D2C0 dz-font-body-16 dz-noptr dz-bold dz-exact-text dz-text-center">
      #tpm_select_advanced_sell_options
    </span>
    <div data-dz="grid"
        data-name="modeGrid"
        class="dz-xy-3-7 dz-wh-94-7 dz-noptr dz-cols-2 dz-rows-1 dz-gap-5">
      <button data-dz="button"
          data-name="entireContainerBtn"
          data-style="Bold"
          data-on-click="OnSellEntireContainerClick"
          class="dz-tc-FE dz-tc-D8D2C0 dz-font-body-12 dz-exact-text"
          data-prop-style="TXBtnDefault">
        #tpm_sell_container
      </button>
      <button data-dz="button"
          data-name="selectItemsBtn"
          data-style="Bold"
          data-on-click="OnSelectItemsClick"
          class="dz-tc-FE dz-tc-D8D2C0 dz-font-body-12 dz-exact-text"
          data-prop-style="TXBtnDefault">
        #tpm_select_items
      </button>
    </div>
    <div data-dz="grid"
        data-name="qtyGrid"
        class="dz-xy-3-16 dz-wh-94-10 dz-noptr dz-cols-2 dz-rows-1 dz-gap-5">
      <div data-dz="panel"
          data-name="qtyMinTab"
          class="dz-wh-full">
        <button data-dz="button"
            data-name="qtyMinBtn"
            data-style="Bold"
            data-on-click="OnQtyMinClick"
            class="dz-xy-0-0 dz-wh-full"
            data-prop-style="TXBtnDefault"></button>
        <span data-dz="text"
            data-name="qtyMinTitle"
            class="dz-xy-0-16 dz-wh-100-36 dz-c-D8D2C0 dz-font-body-14 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          #tpm_minimal_quantity
        </span>
        <span data-dz="text"
            data-name="qtyMinValue"
            data-bind="{{ minimal_quantity }}"
            class="dz-xy-0-52 dz-wh-100-34 dz-c-9A9488 dz-font-body-12 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          60
        </span>
      </div>
      <div data-dz="panel"
          data-name="qtyAllTab"
          class="dz-wh-full">
        <button data-dz="button"
            data-name="qtyAllBtn"
            data-style="Bold"
            data-on-click="OnQtyAllClick"
            class="dz-xy-0-0 dz-wh-full"
            data-prop-style="TXBtnDefault"></button>
        <span data-dz="text"
            data-name="qtyAllTitle"
            class="dz-xy-0-16 dz-wh-100-36 dz-c-D8D2C0 dz-font-body-14 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          #tpm_maximal_quantity
        </span>
        <span data-dz="text"
            data-name="qtyAllValue"
            data-bind="{{ total_quantity }}"
            class="dz-xy-0-52 dz-wh-100-34 dz-c-9A9488 dz-font-body-12 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          5000
        </span>
      </div>
    </div>
    <div data-dz="panel"
        data-name="optDivider"
        data-style="TXDivider"
        class="dz-xy-3-27 dz-wh-94-0 dz-c-FE dz-noptr"></div>
    <div data-dz="panel"
        data-name="CheckoutHost"
        data-style="TXCard"
        data-component="tx-checkout"
        class="dz-xy-1-29 dz-wh-98-70 dz-c-FE"></div>
  </div>
</div>

<script src="dzml-runtime.js?v=1780762083872"></script>
</body>
</html>
