<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<!-- TraderX marketplace HUD toast — GROW-TO-CONTENT model ported from PDANotifications.
     cardSlot is a GRID with Size-To-Content-V (dz-fit-v), so the card grows TALLER for a
     long title / body / per-transaction breakdown instead of clipping it. Every text row is
     a richtext with dz-size-to-text-v so the row grows to its wrapped height; the grid then
     grows the card. NO dz-clip and NO runtime height math anywhere.

     Everything is authored in % so the card keeps its proportions and stays pinned to the
     right edge at 1080p / 1440p / 4K (card x 80% + width 19% -> right edge at 99%).

     Overlay siblings (cannot live inside the grid — a GridSpacer turns every child into a
     row): leftRule (accent bar, trails the card's live left edge + height) and queuePill
     (sits below the card's live bottom). Both are driven by SyncOverlays() in the component.

     data-name contract -> AutoLoadWidgets in TraderXToastCardComponent.c:
       cardSlot, leftRule, iconImg, detailsText, footerText,
       progressTrack, progressFill, queuePill -->
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#0F1215;">

<div data-dz="panel" data-name="cardRoot" class="dz-xy-0-0 dz-wh-full dz-noptr dz-priority-999">

  <!-- Animated card: grid, grows vertically to fit its rows. The runner slides this. -->
  <div data-dz="grid" data-name="cardSlot" data-style="TXToastCard"
      class="dz-xy-75.2-9.5 dz-wh-23.75-14 dz-c-FE dz-noptr dz-fit-v dz-cols-1 dz-pad-12 dz-gap-0">

    <!-- Content rows -->
    <div data-dz="grid" data-name="GridContent"
        class="dz-wh-100-48px dz-noptr dz-fit-v dz-cols-1 dz-pad-4 dz-gap-6">

      <!-- Header: icon well + kicker (source - status) beside it -->
      <div data-dz="panel" data-name="headerRow" class="dz-wh-100-34px dz-noptr">
        <div data-dz="panel" data-name="iconWell" data-style="TXInset"
            class="dz-xy-0px-0px dz-wh-34px-34px dz-c-FE dz-noptr">
          <img data-dz="image" data-name="iconImg" data-image="set:traderx_icons image:sale"
              class="dz-xy-12-12 dz-wh-76-76 dz-c-D9762F dz-noptr" />
        </div>
        <p data-dz="richtext" data-name="kickerText" data-bind="{{ _notif.GetKicker() }}"
            class="dz-xy-68px-0 dz-wh-80-100 dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
          TRADER - SOLD
        </p>
      </div>

      <!-- Title — grows to its wrapped height -->
      <p data-dz="richtext" data-name="titleText" data-bind="{{ _notif.title }}"
          class="dz-wh-100-24px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-wrap dz-strip-newlines dz-size-to-text-v">
        Item Sold
      </p>

      <!-- Body — grows to its wrapped height (was clipped before) -->
      <p data-dz="richtext" data-name="bodyText" data-bind="{{ _notif.body }}"
          class="dz-wh-100-20px dz-c-C2B59C dz-font-nb-17 dz-noptr dz-exact-text dz-wrap dz-strip-newlines dz-size-to-text-v">
        Successfully sold Ammo Box for 800.
      </p>

      <!-- Per-transaction breakdown for bulk trades. One line per transaction; the row grows
           to fit ALL lines (no clip, no line-count math). Component toggles it vs footer. -->
      <p data-dz="richtext" data-name="detailsText" data-bind="{{ _notif.GetDetailsText() }}"
          class="dz-wh-100-18px dz-c-C2B59C dz-font-nb-16 dz-noptr dz-exact-text dz-wrap dz-size-to-text-v dz-hidden">
      </p>

      <!-- Footer (shown when there is no breakdown) -->
      <p data-dz="richtext" data-name="footerText" data-bind="{{ _notif.footer }}"
          class="dz-wh-100-16px dz-c-A39276 dz-font-nb-16 dz-noptr dz-exact-text dz-text-vc dz-hidden">
      </p>
    </div>

    <!-- Progress rule: last grid row, so it always sits at the card's live bottom. -->
    <div data-dz="panel" data-name="progressRow" class="dz-xy-0-0 dz-wh-100-3px dz-noptr">
      <div data-dz="panel" data-name="progressTrack" class="dz-xy-0-0 dz-wh-full dz-c-D9762F24 dz-noptr"></div>
      <div data-dz="panel" data-name="progressFill" class="dz-xy-0-0 dz-wh-full dz-c-D9762F dz-noptr"></div>
    </div>
  </div>

  <!-- Overlay siblings: driven by SyncOverlays() against the card's LIVE geometry. -->

  <!-- Signature accent left rule — trails the card's left edge and dynamic height. -->
  <div data-dz="panel" data-name="leftRule" class="dz-xy-75.2-9.5 dz-wh-0.2-14 dz-c-D9762F dz-noptr"></div>

  <!-- Backlog pill — sits just below the card's live bottom edge. -->
  <div data-dz="panel" data-name="queuePill" class="dz-xy-93-17 dz-wh-6-2 dz-c-1C1813E0 dz-hidden dz-noptr">
    <div data-dz="panel" data-name="queuePillFill" class="dz-xy-1-6 dz-wh-98-88 dz-c-0F0D0ACC dz-noptr">
      <p data-dz="richtext" data-name="queueText" data-bind="{{ queue_count }}"
          class="dz-xy-3-0 dz-wh-40-100 dz-c-D9762F dz-font-nm-14 dz-noptr dz-exact-text dz-text-vc dz-text-right">+3</p>
      <p data-dz="richtext" data-name="queueLabel"
          class="dz-xy-47-0 dz-wh-50-100 dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">QUEUED</p>
    </div>
  </div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
