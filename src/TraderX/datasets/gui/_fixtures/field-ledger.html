<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!--
  TraderX design tokens (Nasdara theme) — SINGLE SOURCE for all TraderX UI styles.
  Shared with TraderXBanking. See docs/TraderX_Design_System.md.

  Regenerate browser CSS:  dzml previewcss _fixtures/field-ledger.html -o dzml-styles.css
  (Generate in-game .styles/atlas from the same tokens via stylesToJsonConfig + generate_styles.py.)
-->
<style type="dz-styles">
  /* Nasdara theme (DayZ Beans Launcher): warm night, ember accent, cream text.
     Deep #0f0d0a (bars) · Night #13100c (page) · Surface #1c1813 (panels) ·
     Raised #262019 (hover/active) · Line #3a3127 (borders) · Ember #d9762f / #e8894a.
     Square corners everywhere (no radius); one accent per screen. */
  .TXContainer    { --bg: #13100c; --border: #3a3127; }
  .TXHeader       { --bg: #0f0d0a; --bottom: #3a3127; }
  .TXFooter       { --bg: #0f0d0a; --top: #3a3127; }
  .TXSideLeft     { --bg: #1c1813; --right: #3a3127; }   /* left column, Line rule on its right */
  .TXSideRight    { --bg: #1c1813; --left: #3a3127; }    /* right column, Line rule on its left */
  .TXInset        { --bg: #0f0d0a; --border: #3a3127; }  /* wells: inputs, previews, chips */
  .TXRowRule      { --bg: #1c181300; --bottom: #2e2720; } /* list row separator */
  .TXFrame        { --bg: #1c181300; --border: #3a3127; }  /* border only, drawn over content */
  .TXContent      { --bg: #13100c; }
  .TXCard         { --bg: #1c1813; --border: #3a3127; }
  .TXCardElevated { --bg: #262019; --border: #3a3127; }
  .TXCardSelected { --bg: #1c181300; --border: #d9762f; }   /* ember selection ring, transparent centre */
  .TXSurface      { --bg: #1c1813; --border: #3a3127; }
  .TXDivider      { --bg: #3a3127; }
  .TXIcon         { --bg: #d9762f; --border: #d9762f; }

  /* Tabs — no fill, 3 px ember underline when active/hovered */
  .TXTab {
    --type: button; --bg: #0f0d0a;
    --highlight-bg: #0f0d0a; --highlight-bottom: #d9762f;
    --pushed-bg: #0f0d0a;    --pushed-bottom: #d9762f;
    --focus-bg: #0f0d0a;     --focus-bottom: #d9762f;
  }

  /* Buttons — ember primary (filled), ember outline accent, neutral default */
  .TXBtnPrimary { --type: button; --bg: #d9762f; --border: #d9762f;
                  --highlight-bg: #e8894a; --pushed-bg: #c4692a; }
  .TXBtnAccent  { --type: button; --bg: #13100c00; --border: #d9762f;
                  --highlight-bg: #262019; --pushed-bg: #1c1813; }
  .TXBtnDanger  { --type: button; --bg: #1c1813; --border: #e07a63;
                  --highlight-bg: #2e1f19; --pushed-bg: #13100c; }
  .TXBtnDefault { --type: button; --bg: #1c1813; --border: #3a3127;
                  --highlight-bg: #262019; --pushed-bg: #13100c; }
  .TXBtnLeave   { --type: button; --bg: #13100c00; --border: #3a3127;
                  --highlight-bg: #262019; --pushed-bg: #13100c; }
  .TXBtnIcon    { --type: button; --bg: #13100c00; --border: #3a3127;
                  --highlight-bg: #262019; --pushed-bg: #13100c; }

  /* Inputs — ember focus border */
  .TXInputField { --type: editbox; --bg: #0f0d0a; --border: #3a3127;
                  --focus-bg: #0f0d0a; --focus-border: #d9762f; }

  /* Status boxes */
  .TXInfoBox    { --bg: #1c1813; --border: #3a3127; }
  .TXSuccessBox { --bg: #1c1813; --border: #7fa65a; }
  .TXWarningBox { --bg: #1c1813; --border: #e0a33a; }
  .TXErrorBox   { --bg: #1c1813; --border: #e07a63; }

  /* Category nav row — filled Raised when hovered/selected */
  .TXCategoryRow     { --type: button; --bg: #1c181300;
                       --highlight-bg: #262019; --pushed-bg: #2e2720; }

  /* List rows — rows separated by a Line rule */
  .TXListRow         { --type: button; --bg: #1c1813; --bottom: #2e2720;
                       --highlight-bg: #262019; --pushed-bg: #1c1813; }
  .TXListRowAlt      { --type: button; --bg: #1c1813; --bottom: #2e2720;
                       --highlight-bg: #262019; --pushed-bg: #1c1813; }
  .TXListRowSelected { --type: button; --bg: #2e2720; --bottom: #2e2720;
                       --highlight-bg: #2e2720; --pushed-bg: #2e2720; }

  .TXBadge { --bg: #d9762f; }

  /* HUD toast card (the accent rule stays a separate widget, recoloured per type) */
  .TXToastCard { --bg: #1c1813; --border: #d9762f; }

  /* Progress / quantity bar */
  .TXProgressBg   { --bg: #0f0d0a; }
  .TXProgressFill { --type: progressbar; --bg: #0f0d0a; --fill: #d9762f; }
</style>
</head>
<body data-dzml></body>
</html>
