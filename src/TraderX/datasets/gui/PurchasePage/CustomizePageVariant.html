<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../dzml.css">
  <link rel="stylesheet" href="../dzml-styles.css">
  <link rel="stylesheet" href="../dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:950px; background:#13100c;">

<!-- Customize page (Nasdara, board "Trader · Customize"): preview + product on the left
     (912 px), tabbed presets / variants / attachments in the middle (552 px), the
     configuration (tx-checkout) on the right (456 px). -->
<div data-dz="panel"
    data-name="CustomizePageView"
    class="dz-xy-0-0 dz-wh-full dz-c-13100C dz-noptr">

  <!-- Back + breadcrumb -->
  <div data-dz="panel"
      data-name="backHost"
      class="dz-xy-29px-24px dz-wh-108px-38px dz-noptr">
    <button data-dz="button"
        data-name="closeBtn"
        data-style="TXBtnDefault"
        data-on-click="OnClose"
        class="dz-xy-0-0 dz-wh-full dz-tc-FE">
      <span data-dz="text"
          data-name="backText"
          class="dz-xy-0-0 dz-wh-full dz-c-C2B59C dz-font-nbb-17 dz-noptr dz-exact-text dz-text-center dz-text-vc">
        #tpm_nav_back
      </span>
    </button>
  </div>
  <div data-dz="wrap"
      data-name="breadcrumbRow"
      class="dz-xy-153px-24px dz-wh-730px-38px dz-noptr">
    <span data-dz="text"
        data-name="breadcrumbPath"
        data-bind="{{ breadcrumb_path }}"
        class="dz-wh-1px-38px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
      Purchase / Assault Rifles /
    </span>
    <span data-dz="text"
        data-name="breadcrumbItem"
        data-bind="{{ product_classname }}"
        class="dz-wh-1px-38px dz-c-F2E9D8 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
      KA-74
    </span>
  </div>

  <!-- Preview -->
  <div data-dz="panel"
      data-name="previewArea"
      data-style="TXInset"
      class="dz-xy-29px-77px dz-wh-854px-610px dz-c-FE dz-noptr">
    <div data-dz="preview"
        data-name="itemPreview"
        data-bind-item="{{ preview }}"
        data-enable-rotation="1"
        data-enable-scale="1"
        class="dz-xy-0-0 dz-wh-92-90 dz-align-cc"></div>
    <span data-dz="text"
        data-name="previewHint"
        class="dz-xy-0-17px dz-wh-100-18px dz-align-bc dz-c-6F624F dz-font-nbb-14 dz-noptr dz-exact-text dz-text-center dz-text-vc">
      #tpm_drag_to_rotate
    </span>
  </div>

  <!-- Product -->
  <span data-dz="text"
      data-name="TextWidget1"
      data-bind="{{ product_title }}"
      class="dz-xy-29px-698px dz-wh-640px-69px dz-c-F2E9D8 dz-font-nh-48 dz-noptr dz-exact-text dz-text-vc">
    KA-74
  </span>
  <div data-dz="multitext"
      data-name="RichTextWidget0"
      data-bind="{{ product_description }}"
      class="dz-xy-29px-768px dz-wh-672px-90px dz-c-C2B59C dz-font-nb-18 dz-noptr dz-exact-text dz-wrap">
    Selective-fire assault rifle fed from a detachable magazine.
  </div>
  <span data-dz="text"
      data-name="LabelTotal"
      class="dz-xy-683px-708px dz-wh-200px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-right dz-text-vc">
    #tpm_base_price_caps
  </span>
  <span data-dz="text"
      data-name="TextWidget3"
      data-bind="{{ base_price }}"
      class="dz-xy-583px-728px dz-wh-300px-32px dz-c-F2E9D8 dz-font-nm-26 dz-noptr dz-exact-text dz-text-right dz-text-vc">
    € 0
  </span>

  <!-- Middle column: tabs + tab content -->
  <div data-dz="panel"
      data-name="tabsColumn"
      data-style="TXSideRight"
      class="dz-xy-912px-0 dz-wh-552px-950px dz-c-FE dz-noptr">
    <div data-dz="panel"
        data-name="tabsRow"
        data-style="TXRowRule"
        class="dz-xy-0-0 dz-wh-100-67px dz-c-FE dz-noptr">
      <div data-dz="panel"
          data-name="presetsTab"
          class="dz-xy-0-0 dz-wh-184px-67px dz-noptr">
        <div data-dz="panel"
            data-name="presetsTabBg"
            class="dz-xy-0-0 dz-wh-full dz-c-262019 dz-noptr dz-hidden"></div>
        <button data-dz="button"
            data-name="tabPresetsBtn"
            data-style="Empty"
            data-on-click="OnTabPresets"
            class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text"
            data-name="presetsTabTitle"
            data-bind="{{ tab_presets_title }}"
            class="dz-xy-0-10px dz-wh-100-27px dz-c-A39276 dz-font-nh-19 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          PRESETS
        </span>
        <span data-dz="text"
            data-name="TextWidget5"
            data-bind="{{ tab_presets_sub }}"
            class="dz-xy-0-37px dz-wh-100-18px dz-c-A39276 dz-font-nbb-16 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          2 saved
        </span>
        <div data-dz="panel"
            data-name="presetsTabLine"
            class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
      <div data-dz="panel"
          data-name="variantsTab"
          class="dz-xy-184px-0 dz-wh-184px-67px dz-noptr">
        <div data-dz="panel"
            data-name="variantsTabBg"
            class="dz-xy-0-0 dz-wh-full dz-c-262019 dz-noptr dz-hidden"></div>
        <button data-dz="button"
            data-name="tabVariantsBtn"
            data-style="Empty"
            data-on-click="OnTabVariants"
            class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text"
            data-name="variantsTabTitle"
            data-bind="{{ tab_variants_title }}"
            class="dz-xy-0-10px dz-wh-100-27px dz-c-A39276 dz-font-nh-19 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          VARIANTS
        </span>
        <span data-dz="text"
            data-name="TextWidget7"
            data-bind="{{ variant_name }}"
            class="dz-xy-0-37px dz-wh-100-18px dz-c-A39276 dz-font-nbb-16 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          KA-74
        </span>
        <div data-dz="panel"
            data-name="variantsTabLine"
            class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
      <div data-dz="panel"
          data-name="attachmentsTab"
          class="dz-xy-368px-0 dz-wh-184px-67px dz-noptr">
        <div data-dz="panel"
            data-name="attachmentsTabBg"
            class="dz-xy-0-0 dz-wh-full dz-c-262019 dz-noptr dz-hidden"></div>
        <button data-dz="button"
            data-name="tabAttachmentsBtn"
            data-style="Empty"
            data-on-click="OnTabAttachments"
            class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
        <span data-dz="text"
            data-name="attachmentsTabTitle"
            data-bind="{{ tab_attachments_title }}"
            class="dz-xy-0-10px dz-wh-100-27px dz-c-A39276 dz-font-nh-19 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          ATTACHMENTS
        </span>
        <span data-dz="text"
            data-name="attachmentsTabSub"
            data-bind="{{ tab_attachments_sub }}"
            class="dz-xy-0-37px dz-wh-100-18px dz-c-A39276 dz-font-nbb-16 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          4 of 5 slots
        </span>
        <div data-dz="panel"
            data-name="attachmentsTabLine"
            class="dz-xy-0-0 dz-wh-100-3px dz-align-bc dz-c-D9762F dz-noptr dz-hidden"></div>
      </div>
    </div>
    <div data-dz="panel"
        data-name="tabContent"
        data-component="{{ current_tab }}"
        class="dz-xy-0-67px dz-wh-551px-883px dz-align-x-right dz-clip"></div>
  </div>

  <!-- Configuration -->
  <div data-dz="panel"
      data-name="checkoutHost"
      data-component="tx-checkout"
      class="dz-xy-0-0 dz-wh-456px-950px dz-align-x-right"></div>

  <div data-dz="panel"
      data-name="modalPanel"
      data-component="{{ current_modal }}"
      class="dz-xy-0-0 dz-wh-full dz-align-cc dz-noptr dz-priority-999"></div>
</div>

<script src="../dzml-runtime.js"></script>
</body>
</html>
