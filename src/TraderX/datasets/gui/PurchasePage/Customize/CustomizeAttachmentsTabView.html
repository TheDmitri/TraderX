<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../dzml.css">
  <link rel="stylesheet" href="../../dzml-styles.css">
  <link rel="stylesheet" href="../../dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:552px; height:883px; background:#1c1813;">

<!-- Attachments tab (Nasdara, board "Trader · Customize"): one row per slot, then the
     preset chips. -->
<div data-dz="panel"
    data-name="CustomizeAttachmentsTab"
    class="dz-xy-0-0 dz-wh-full dz-noptr">
  <div data-dz="scroll"
      data-name="attachmentsScroll"
      class="dz-xy-0-10px dz-wh-100-700px dz-scroll-v">
    <div data-dz="grid"
        data-name="slotGrid"
        data-foreach="{{ _inputSlots }}"
        data-template="tx-customize-slot-row"
        data-item="_inputSlot"
        class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100"></div>
  </div>
  <div data-dz="panel"
      data-name="attachmentGridList"
      class="dz-xy-0-0 dz-wh-1px-1px dz-noptr dz-hidden"></div>
  <div data-dz="panel"
      data-name="attachmentGridTiles"
      class="dz-xy-0-0 dz-wh-1px-1px dz-noptr dz-hidden"></div>
  <span data-dz="text"
      data-name="emptyState"
      data-bind="{{ empty_label }}"
      class="dz-xy-0-60px dz-wh-100-30px dz-c-A39276 dz-font-nb-18 dz-noptr dz-exact-text dz-text-center"></span>

  <div data-dz="panel"
      data-name="presetChipsPanel"
      class="dz-xy-0-0 dz-wh-100-163px dz-align-bl dz-noptr">
    <div data-dz="panel"
        data-name="presetChipsRule"
        class="dz-xy-0-0 dz-wh-100-1px dz-c-3A3127 dz-noptr"></div>
    <span data-dz="text"
        data-name="presetChipsLabel"
        data-bind="{{ presets_label }}"
        class="dz-xy-24px-19px dz-wh-300px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
      YOUR PRESETS
    </span>
    <div data-dz="grid"
        data-name="presetChipsGrid"
        data-foreach="{{ _inputPresetChips }}"
        data-template="tx-customize-preset-chip"
        data-item="_inputPreset"
        class="dz-xy-24px-50px dz-wh-504px-1px dz-fit-v dz-cols-2 dz-rows-10 dz-gap-12"></div>
  </div>
</div>

<script src="../../dzml-runtime.js"></script>
</body>
</html>
