<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../dzml.css">
  <link rel="stylesheet" href="../../dzml-styles.css">
  <link rel="stylesheet" href="../../dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:552px; height:883px; background:#1c1813;">

<!-- Presets tab (Nasdara): "+ Create new preset", then one row per preset. -->
<div data-dz="panel"
    data-name="CustomizePresetsTab"
    class="dz-xy-0-0 dz-wh-full dz-noptr">
  <div data-dz="panel"
      data-name="newPresetHost"
      data-component="tx-new-preset-card"
      class="dz-xy-24px-24px dz-wh-504px-58px"></div>
  <div data-dz="scroll"
      data-name="presetsScroll"
      class="dz-xy-0-102px dz-wh-100-775px dz-scroll-v">
    <div data-dz="grid"
        data-name="presetGrid"
        data-foreach="{{ _inputPresets }}"
        data-template="tx-preset-card"
        data-item="_inputPreset"
        class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100"></div>
  </div>
  <span data-dz="text"
      data-name="emptyState"
      data-bind="{{ empty_label }}"
      class="dz-xy-0-130px dz-wh-100-30px dz-c-A39276 dz-font-nb-18 dz-noptr dz-exact-text dz-text-center"></span>
</div>

<script src="../../dzml-runtime.js"></script>
</body>
</html>
