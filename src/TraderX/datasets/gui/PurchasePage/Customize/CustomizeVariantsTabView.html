<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../dzml.css">
  <link rel="stylesheet" href="../../dzml-styles.css">
  <link rel="stylesheet" href="../../dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:552px; height:883px; background:#1c1813;">

<!-- Variants tab (Nasdara): one row per variant of the product. -->
<div data-dz="panel"
    data-name="CustomizeVariantsTab"
    class="dz-xy-0-0 dz-wh-full dz-noptr">
  <div data-dz="scroll"
      data-name="variantsScroll"
      class="dz-xy-0-10px dz-wh-100-870px dz-scroll-v">
    <div data-dz="grid"
        data-name="variantsGrid"
        data-foreach="{{ _inputVariants }}"
        data-template="tx-variant-card"
        data-item="_inputProduct"
        class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100"></div>
  </div>
  <span data-dz="text"
      data-name="emptyState"
      data-bind="{{ empty_label }}"
      class="dz-xy-0-60px dz-wh-100-30px dz-c-A39276 dz-font-nb-18 dz-noptr dz-exact-text dz-text-center"></span>
</div>

<script src="../../dzml-runtime.js"></script>
</body>
</html>
