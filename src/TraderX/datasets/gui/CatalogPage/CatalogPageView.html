<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:950px; background:#13100c;">

<!-- Catalog page (Nasdara, same frame as "Trader · Purchase"): every category of this
     trader as collapsible sections on the left, the selected item's details 456 px on
     the right. -->
<div data-dz="panel"
    data-name="CatalogPageView"
    class="dz-xy-0-0 dz-wh-full dz-c-13100C dz-noptr">

  <div data-dz="wrap"
      data-name="catalogTitleRow"
      class="dz-xy-29px-24px dz-wh-600px-60px dz-noptr dz-gap-19">
    <span data-dz="text"
        data-name="catalogHeading"
        class="dz-wh-1px-57px dz-c-F2E9D8 dz-font-nh-41 dz-noptr dz-exact-text dz-text-vb dz-size-to-text-h">
      #tpm_catalog_caps
    </span>
    <span data-dz="text"
        data-name="catalogTitle"
        class="dz-wh-1px-54px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vb dz-size-to-text-h">
      #tpm_catalog_items
    </span>
  </div>
  <div data-dz="panel"
      data-name="SearchBarHost"
      data-component="tx-search-bar"
      class="dz-xy-600px-26px dz-wh-360px-45px dz-align-x-right"></div>
  <div data-dz="panel"
      data-name="toggleExpandHost"
      class="dz-xy-980px-27px dz-wh-150px-43px dz-align-x-right dz-noptr">
    <button data-dz="button"
        data-name="toggleExpandBtn"
        data-style="TXBtnDefault"
        data-on-click="OnToggleExpandClick"
        class="dz-xy-0-0 dz-wh-full dz-tc-FE dz-hidden">
      <span data-dz="text"
          data-name="toggleExpandText"
          class="dz-xy-0-0 dz-wh-full dz-c-C2B59C dz-font-nbb-17 dz-noptr dz-exact-text dz-text-center dz-text-vc">
        #tpm_expand_all
      </span>
    </button>
  </div>
  <div data-dz="panel"
      data-name="syncIndicator"
      class="dz-xy-980px-27px dz-wh-150px-43px dz-align-x-right dz-noptr">
    <img data-dz="image"
      data-name="syncIcon"
      class="dz-xy-0-0 dz-wh-18px-18px dz-align-y-center dz-c-D9762F dz-noptr"
      data-image="set:traderx_icons image:refresh"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="syncText"
        class="dz-xy-28px-0 dz-wh-120px-43px dz-c-A39276 dz-font-nb-16 dz-noptr dz-text-vc dz-exact-text">
      #tpm_syncing
    </span>
  </div>
  <div data-dz="panel"
      data-name="ViewToggleHost"
      data-component="tx-view-toggle"
      class="dz-xy-485px-28px dz-wh-96px-41px dz-align-x-right dz-noptr"></div>
  <div data-dz="scroll"
      data-name="scrollCategory"
      class="dz-xy-29px-96px dz-wh-1406px-830px dz-scroll-v">
    <div data-dz="grid"
        data-name="categoryGrid"
        data-foreach="{{ _inputCategories }}"
        data-template="tx-catalog-category-card"
        data-item="_inputCategory"
        class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100 dz-gap-10"></div>
  </div>

  <!-- Item details -->
  <div data-dz="panel"
      data-name="ItemDetailsPanel"
      data-style="TXSideRight"
      class="dz-xy-0-0 dz-wh-456px-950px dz-align-x-right dz-c-FE dz-noptr">
    <div data-dz="panel"
        data-name="detailsHeader"
        data-style="TXRowRule"
        class="dz-xy-0-0 dz-wh-100-77px dz-c-FE dz-noptr">
      <span data-dz="text"
          data-name="detailsTitle"
          class="dz-xy-24px-0 dz-wh-400px-77px dz-c-F2E9D8 dz-font-nh-29 dz-noptr dz-exact-text dz-text-vc">
        #tpm_item_details_caps
      </span>
    </div>
    <div data-dz="panel"
        data-name="detailPreviewBg"
        data-style="TXInset"
        class="dz-xy-24px-101px dz-wh-408px-300px dz-c-FE dz-noptr"></div>
    <div data-dz="preview"
        data-name="itemPreview"
        data-bind-item="{{ selected_preview }}"
        data-enable-rotation="1"
        data-enable-scale="1"
        class="dz-xy-34px-111px dz-wh-388px-280px"></div>
    <span data-dz="text"
        data-name="itemName"
        data-bind="{{ selected_item_name }}"
        class="dz-xy-24px-418px dz-wh-408px-42px dz-c-F2E9D8 dz-font-nh-29 dz-noptr dz-exact-text dz-text-vc">
      #tpm_select_item_for_details
    </span>
    <span data-dz="text"
        data-name="stockText"
        data-bind="{{ selected_stock }}"
        class="dz-xy-24px-461px dz-wh-408px-22px dz-c-A39276 dz-font-nm-16 dz-noptr dz-exact-text dz-text-vc"></span>
    <div data-dz="panel"
        data-name="buyBox"
        data-style="TXCard"
        class="dz-xy-24px-501px dz-wh-196px-86px dz-c-FE dz-noptr">
      <span data-dz="text"
          data-name="buyLabel"
          class="dz-xy-17px-14px dz-wh-170px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
        #tpm_buy_price_caps
      </span>
      <span data-dz="text"
          data-name="buyPrice"
          data-bind="{{ selected_buy_price }}"
          class="dz-xy-17px-38px dz-wh-170px-36px dz-c-E8894A dz-font-nm-29 dz-noptr dz-exact-text dz-text-vc">
        –
      </span>
    </div>
    <div data-dz="panel"
        data-name="sellBox"
        data-style="TXCard"
        class="dz-xy-236px-501px dz-wh-196px-86px dz-c-FE dz-noptr">
      <span data-dz="text"
          data-name="sellLabel"
          class="dz-xy-17px-14px dz-wh-170px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
        #tpm_sell_price_caps
      </span>
      <span data-dz="text"
          data-name="sellPrice"
          data-bind="{{ selected_sell_price }}"
          class="dz-xy-17px-38px dz-wh-170px-36px dz-c-7FA65A dz-font-nm-29 dz-noptr dz-exact-text dz-text-vc">
        –
      </span>
    </div>
    <span data-dz="text"
        data-name="descLabel"
        class="dz-xy-24px-611px dz-wh-408px-18px dz-c-A39276 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-vc">
      #tpm_description_caps
    </span>
    <div data-dz="panel"
        data-name="descBox"
        class="dz-xy-24px-637px dz-wh-408px-289px dz-noptr">
      <div data-dz="richtext"
          data-name="descText"
          data-bind="{{ selected_description }}"
          class="dz-xy-0-0 dz-wh-full dz-c-C2B59C dz-font-nb-18 dz-noptr dz-exact-text dz-wrap">
        Select an item to view details
      </div>
    </div>
  </div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
