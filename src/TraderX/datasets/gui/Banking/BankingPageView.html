<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="frame"
    data-name="rootFrame"
    class="dz-xy-0-0 dz-wh-full dz-align-cc">
  <div data-dz="panel"
      data-name="bankingRoot"
      data-style="TXContainer"
      class="dz-xy-0-0 dz-wh-50-70 dz-align-cc dz-c-FE">
    <div data-dz="panel"
        data-name="headerBar"
        data-style="TXHeader"
        class="dz-xy-0-0 dz-wh-100-8 dz-c-FE dz-noptr">
      <span data-dz="text"
          data-name="headerTitle"
          class="dz-xy-2-0 dz-wh-20-100 dz-tc-D8D2C0 dz-font-body-16 dz-noptr dz-bold dz-exact-text dz-text-vc">
        BANK
      </span>
      <div data-dz="panel"
          data-name="balancePanel"
          class="dz-xy-60-0 dz-wh-38-100 dz-noptr">
        <span data-dz="text"
            data-name="balanceLabel"
            class="dz-xy-0-0 dz-wh-30-100 dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          BALANCE
        </span>
        <span data-dz="text"
            data-name="balanceValue"
            class="dz-xy-32-0 dz-wh-45-100 dz-tc-C4A35A dz-font-body-16 dz-noptr dz-bold dz-exact-text dz-text-vc dz-text-right">
          0
        </span>
        <span data-dz="text"
            data-name="balanceCurrency"
            class="dz-xy-78-0 dz-wh-20-100 dz-tc-9A9488 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
          TC
        </span>
      </div>
    </div>
    <div data-dz="grid"
        data-name="tabNavGrid"
        class="dz-xy-0-8 dz-wh-100-6 dz-noptr dz-cols-3 dz-rows-1">
      <button data-dz="button"
          data-name="tabAccount"
          data-style="TXTabActive"
          class="dz-tc-FE dz-tc-D8D2C0 dz-font-body-16">
        ACCOUNT
      </button>
      <button data-dz="button"
          data-name="tabTransfer"
          data-style="TXTabInactive"
          class="dz-tc-FE dz-tc-9A9488 dz-font-body-16">
        TRANSFER
      </button>
      <button data-dz="button"
          data-name="tabLeave"
          data-style="TXBtnLeave"
          class="dz-tc-FE dz-tc-D8D2C0 dz-font-body-16">
        LEAVE
      </button>
    </div>
    <div data-dz="panel"
        data-name="tabDivider"
        data-style="TXDivider"
        class="dz-xy-0-14 dz-wh-100-0 dz-c-FE dz-noptr"></div>
    <div data-dz="panel"
        data-name="accountPanel"
        class="dz-xy-0-15 dz-wh-100-85 dz-noptr">
      <div data-dz="panel"
          data-name="bankAmountSection"
          data-style="TXCard"
          class="dz-xy-3-3 dz-wh-94-18 dz-c-FE dz-noptr">
        <span data-dz="text"
            data-name="bankAmountLabel"
            class="dz-xy-35-8 dz-wh-62-35 dz-tc-D8D2C0 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
          0
        </span>
        <span data-dz="text"
            data-name="playerAmountLabel"
            class="dz-xy-35-48 dz-wh-62-35 dz-tc-9A9488 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
          0
        </span>
      </div>
      <div data-dz="panel"
          data-name="transactionSection"
          data-style="TXCard"
          class="dz-xy-3-23 dz-wh-94-22 dz-c-FE dz-noptr">
        <span data-dz="text"
            data-name="transactionLabel"
            class="dz-xy-3-8 dz-wh-30-30 dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          AMOUNT
        </span>
        <input data-dz="editbox"
            data-name="transactionAmountInput"
            data-style="Default"
            class="dz-xy-35-8 dz-wh-50-30 dz-tc-FE dz-tc-FE dz-font-body-16 dz-exact-text"/>
        <span data-dz="text"
            data-name="feesLabel"
            class="dz-xy-3-50 dz-wh-30-30 dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          FEES
        </span>
        <span data-dz="text"
            data-name="feesValue"
            class="dz-xy-35-50 dz-wh-50-30 dz-tc-9A9488 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
          5%
        </span>
      </div>
      <div data-dz="grid"
          data-name="actionButtonGrid"
          class="dz-xy-3-47 dz-wh-94-10 dz-cols-2 dz-rows-1 dz-gap-8">
        <button data-dz="button"
            data-name="depositBtn"
            data-style="TXBtnPrimary"
            class="dz-tc-FE dz-tc-D8D2C0 dz-font-body-16">
          DEPOSIT
        </button>
        <button data-dz="button"
            data-name="withdrawBtn"
            data-style="TXBtnDanger"
            class="dz-tc-FE dz-tc-D8D2C0 dz-font-body-16">
          WITHDRAW
        </button>
      </div>
      <div data-dz="panel"
          data-name="progressSection"
          class="dz-xy-3-59 dz-wh-94-8 dz-noptr">
        <div data-dz="panel"
            data-name="progressBg"
            data-style="TXProgressBg"
            class="dz-xy-0-30 dz-wh-100-40 dz-c-FE dz-noptr">
          <div data-dz="panel"
              data-name="progressFill"
              data-style="TXProgressFill"
              class="dz-xy-0-0 dz-wh-50-100 dz-c-FE dz-noptr"></div>
        </div>
        <span data-dz="text"
            data-name="maxLabel"
            class="dz-xy-0-0 dz-wh-100-25 dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          MAX
        </span>
        <span data-dz="text"
            data-name="maxValue"
            class="dz-xy-0-75 dz-wh-100-25 dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          1,000,000
        </span>
      </div>
      <div data-dz="panel"
          data-name="accountIdSection"
          data-style="TXCard"
          class="dz-xy-3-70 dz-wh-94-12 dz-c-FE dz-noptr">
        <span data-dz="text"
            data-name="accountIdLabel"
            data-style="Normal"
            class="dz-xy-25-15 dz-wh-48-70 dz-tc-FE dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          ACCOUNT
          <span data-dz="text"
              data-name="accountIdValue"
              class="dz-xy-3-0 dz-wh-94-100 dz-tc-9A9488 dz-font-body-16 dz-noptr dz-exact-text dz-text-center dz-text-vc">
            76561198000000000
          </span>
        </span>
        <button data-dz="button"
            data-name="copyIdBtn"
            data-style="TXBtnDefault"
            class="dz-xy-75-15 dz-wh-22-70 dz-tc-FE dz-tc-9A9488 dz-font-body-16">
          COPY
        </button>
      </div>
      <div data-dz="panel"
          data-name="statusPanel"
          data-style="TXInfoBox"
          class="dz-xy-3-84 dz-wh-94-8 dz-c-FE dz-noptr dz-hidden">
        <p data-dz="richtext"
            data-name="statusMessage"
            class="dz-xy-3-0 dz-wh-94-100 dz-tc-C93030 dz-font-body-16 dz-noptr dz-wrap dz-exact-text dz-text-vc"></p>
      </div>
    </div>
    <div data-dz="panel"
        data-name="transferPanel"
        class="dz-xy-0-15 dz-wh-100-85 dz-noptr dz-hidden">
      <div data-dz="panel"
          data-name="transferBalanceSection"
          data-style="TXCard"
          class="dz-xy-3-3 dz-wh-94-14 dz-c-FE dz-noptr">
        <span data-dz="text"
            data-name="transferBankLabel"
            class="dz-xy-35-0 dz-wh-62-100 dz-tc-D8D2C0 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
          0
        </span>
      </div>
      <div data-dz="panel"
          data-name="transferAmountSection"
          data-style="TXCard"
          class="dz-xy-3-19 dz-wh-94-16 dz-c-FE dz-noptr">
        <span data-dz="text"
            data-name="transferAmountLabel"
            data-style="Normal"
            class="dz-xy-35-10 dz-wh-50-35 dz-tc-FE dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          TRANSFER
        </span>
        <span data-dz="text"
            data-name="transferFeesLabel"
            class="dz-xy-3-55 dz-wh-30-35 dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          FEES
        </span>
        <span data-dz="text"
            data-name="transferFeesValue"
            class="dz-xy-35-55 dz-wh-50-35 dz-tc-9A9488 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
          5%
        </span>
      </div>
      <div data-dz="panel"
          data-name="transferDestSection"
          data-style="TXCard"
          class="dz-xy-3-37 dz-wh-94-16 dz-c-FE dz-noptr">
        <span data-dz="text"
            data-name="transferDestLabel"
            data-style="Normal"
            class="dz-xy-35-15 dz-wh-62-70 dz-tc-FE dz-tc-6A6560 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
          DESTINATION
        </span>
      </div>
      <button data-dz="button"
          data-name="transferBtn"
          data-style="TXBtnDanger"
          class="dz-xy-3-55 dz-wh-94-10 dz-tc-FE dz-tc-D8D2C0 dz-font-body-16">
        SEND
      </button>
      <div data-dz="panel"
          data-name="transferStatusPanel"
          data-style="TXInfoBox"
          class="dz-xy-3-67 dz-wh-94-8 dz-c-FE dz-noptr dz-hidden">
        <p data-dz="richtext"
            data-name="transferStatusMessage"
            class="dz-xy-3-0 dz-wh-94-100 dz-tc-C93030 dz-font-body-16 dz-noptr dz-wrap dz-exact-text dz-text-vc"></p>
      </div>
    </div>
  </div>
</div>

<script src="dzml-runtime.js?v=1780762080419"></script>
</body>
</html>
