<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<!-- "Create New Preset" — compact add card filling its (narrow) host column so the
     preset cards get the rest of the width. Full-size button is the click target;
     the dashed overlay (add icon + wrapped label) is non-interactive. -->
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="NewPresetPanel"
    data-style="blank"
    class="dz-xy-0-0 dz-wh-full dz-c-FE">
  <button data-dz="button"
      data-name="newPresetBtn"
      data-style="TXBtnDefault"
      data-on-click="OnNewPresetClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="dashedBox"
      data-style="dashed"
      class="dz-xy-4-2 dz-wh-92-96 dz-c-FE dz-noptr">
    <img data-dz="image"
        data-name="addIcon"
        class="dz-xy-0-36 dz-wh-36px-36px dz-align-x-center dz-c-D8 dz-noptr"
        data-image="set:traderx_icons image:add"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="newPresetLabel"
        class="dz-xy-4-52 dz-wh-92-30 dz-align-x-center dz-c-D8D2C0 dz-font-heading-22 dz-noptr dz-wrap dz-text-center">
      #tpm_create_new_preset
    </span>
  </div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
