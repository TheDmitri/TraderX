<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../dzml.css">
  <link rel="stylesheet" href="../../dzml-styles.css">
  <link rel="stylesheet" href="../../dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:504px; height:58px; background:#1c1813;">

<!-- "+ Create new preset" (ember outline button). -->
<div data-dz="panel"
    data-name="NewPresetPanel"
    class="dz-xy-0-0 dz-wh-full dz-noptr">
  <button data-dz="button"
      data-name="newPresetBtn"
      data-style="TXBtnAccent"
      data-on-click="OnNewPresetClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="dashedBox"
      class="dz-xy-0-0 dz-wh-1px-1px dz-noptr dz-hidden"></div>
  <img data-dz="image"
      data-name="addIcon"
      class="dz-xy-160px-0 dz-wh-17px-17px dz-align-y-center dz-c-D9762F dz-noptr"
      data-image="set:traderx_icons image:add"
      data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
  <span data-dz="text"
      data-name="newPresetLabel"
      class="dz-xy-188px-0 dz-wh-280px-58px dz-c-F2E9D8 dz-font-nbb-19 dz-noptr dz-exact-text dz-text-vc">
    #tpm_create_new_preset
  </span>
</div>

<script src="../../dzml-runtime.js"></script>
</body>
</html>
