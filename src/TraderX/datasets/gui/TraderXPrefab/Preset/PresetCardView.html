<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../dzml.css">
  <link rel="stylesheet" href="../../dzml-styles.css">
  <link rel="stylesheet" href="../../dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:552px; height:96px; background:#1c1813;">

<!-- Preset row (Nasdara): well with the configured weapon, name, "€ 670 · yours",
     set-default / rename / delete. -->
<div data-dz="panel"
    data-name="presetCardView"
    data-style="TXRowRule"
    class="dz-xy-0-0 dz-wh-100-96px dz-c-FE dz-noptr">
  <button data-dz="button"
      data-name="presetBtn"
      data-style="TXListRow"
      data-on-click="OnPresetClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="presetCardContent"
      class="dz-xy-0-0 dz-wh-full dz-noptr">
    <div data-dz="panel"
        data-name="previewWell"
        data-style="TXInset"
        class="dz-xy-24px-14px dz-wh-67px-67px dz-c-FE dz-noptr"></div>
    <div data-dz="preview"
        data-name="presetPreview"
        data-bind-item="{{ preview }}"
        class="dz-xy-25px-15px dz-wh-65px-65px dz-noptr dz-clip"></div>
    <span data-dz="text"
        data-name="presetNameText"
        data-bind="{{ preset_name }}"
        class="dz-xy-108px-22px dz-wh-260px-26px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-text-vc">
      Preset - 2
    </span>
    <div data-dz="wrap"
        data-name="priceGrid"
        class="dz-xy-108px-50px dz-wh-260px-22px dz-noptr dz-gap-10">
      <span data-dz="text"
          data-name="priceText"
          data-bind="{{ price }}"
          class="dz-wh-1px-22px dz-c-E8894A dz-font-nm-18 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
        € 670
      </span>
      <span data-dz="text"
          data-name="ownerText"
          data-bind="{{ preset_owner }}"
          class="dz-wh-1px-22px dz-c-A39276 dz-font-nb-16 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
        server default
      </span>
    </div>
  </div>
  <div data-dz="panel"
      data-name="presetCardOutline"
      class="dz-xy-0-0 dz-wh-1px-1px dz-noptr dz-hidden"></div>
  <button data-dz="button"
      data-name="defaultPresetBtn"
      data-style="TXBtnIcon"
      data-on-click="OnDefaultPresetClick"
      class="dz-xy-122px-0 dz-wh-41px-41px dz-align-cr dz-tc-FE">
    <img data-dz="image"
        data-name="defaultPresetImg"
        class="dz-xy-0-0 dz-wh-18px-18px dz-align-cc dz-c-C2B59C dz-noptr"
        data-image="set:traderx_icons image:star_full"
        data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="editBtn"
      data-style="TXBtnIcon"
      data-on-click="OnEditPresetClick"
      class="dz-xy-73px-0 dz-wh-41px-41px dz-align-cr dz-tc-FE">
    <img data-dz="image"
        data-name="editIcon"
        class="dz-xy-0-0 dz-wh-18px-18px dz-align-cc dz-c-C2B59C dz-noptr"
        data-image="set:traderx_icons image:edit"
        data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="deleteBtn"
      data-style="TXBtnIcon"
      data-on-click="OnDeletePresetClick"
      class="dz-xy-24px-0 dz-wh-41px-41px dz-align-cr dz-tc-FE">
    <img data-dz="image"
        data-name="deleteIcon"
        class="dz-xy-0-0 dz-wh-18px-18px dz-align-cc dz-c-E07A63 dz-noptr"
        data-image="set:traderx_icons image:trash"
        data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
  </button>
</div>

<script src="../../dzml-runtime.js"></script>
</body>
</html>
