<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="PaymentResume"
    class="dz-xy-2-1 dz-wh-470px-92px dz-noptr">
  <span data-dz="text"
      data-name="PaymentAmount"
      class="dz-wh-9-39 dz-align-x-right dz-tc-9BA63B dz-font-mono-28 dz-noptr dz-text-vc dz-size-to-text-h">
    To pay: 13,350
  </span>
  <div data-dz="panel"
      data-name="PanelWidget5"
      data-style="TXCard"
      class="dz-xy-0-14 dz-wh-36-45 dz-align-br dz-c-FE dz-noptr">
    <button data-dz="button"
        data-name="ButtonWidget0"
        data-style="Empty"
        class="dz-wh-full dz-align-cc dz-tc-FE"></button>
    <span data-dz="text"
        data-name="TextWidget4"
        class="dz-xy-0-0 dz-wh-full dz-align-cc dz-tc-9BA63B dz-font-heading-22 dz-noptr dz-text-center dz-text-vc">
      Purchase

  </div>
  <img data-dz="image"
      data-name="StockLabel15"
      class="dz-xy-37-38 dz-wh-24px-24px dz-align-br dz-noptr"
      data-image="set:traderx_icons image:bank"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  <img data-dz="image"
      data-name="StockLabel16"
      class="dz-xy-37-9 dz-wh-24px-24px dz-align-br dz-noptr"
      data-image="set:traderx_icons image:wallet"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  <span data-dz="text"
      data-name="WalletAccount"
      class="dz-xy-44-9 dz-wh-48px-24px dz-align-br dz-font-mono-22 dz-noptr dz-text-vc dz-size-to-text-h">
    34,000
  </span>
  <span data-dz="text"
      data-name="BankAccount"
      class="dz-xy-44-38 dz-wh-48px-24px dz-align-br dz-font-mono-22 dz-noptr dz-text-vc dz-size-to-text-h">
    132,000,000
  </span>
</div>
