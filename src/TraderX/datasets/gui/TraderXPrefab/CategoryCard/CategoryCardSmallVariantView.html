<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="grid"
    data-name="categoryCard"
    class="dz-xy-10px-10px dz-wh-48px-48px dz-noptr dz-fit-v dz-cols-1 dz-rows-2">
  <div data-dz="panel"
      data-name="PanelWidget2"
      data-style="TXSurface"
      class="dz-xy-0-0 dz-wh-77px-56px dz-c-FE dz-noptr">
    <button data-dz="button"
        data-name="categoryBtn"
        data-style="Empty"
        data-user-id="345"
        class="dz-xy-0-0 dz-wh-100-86 dz-align-x-center dz-tc-FE">
      <div data-dz="panel"
          data-name="GridCategory"
          data-style="TXCard"
          data-disabled="0"
          class="dz-xy-0--1 dz-wh-full dz-c-FE dz-noptr">
        <img data-dz="image"
            data-name="categoryIcon"
            class="dz-xy-2-0 dz-wh-42px-42px dz-align-y-center dz-noptr"
            data-image="set:traderx_icons image:rifle"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
        <span data-dz="text"
            data-name="CategoryName"
            data-style="Normal"
            class="dz-xy-8--1 dz-wh-50-91 dz-align-y-center dz-tc-FE dz-tc-0F dz-font-heading-28 dz-noptr dz-text-vc">
          Category Name
        </span>
        <div data-dz="grid"
            data-name="dropdownParentPanel"
            class="dz-xy-10-9 dz-wh-100-95 dz-align-cr dz-noptr dz-fit-h dz-cols-2 dz-rows-1 dz-pad-15 dz-gap-3">
          <div data-dz="panel"
              data-name="PanelWidget4"
              data-style="TXSurface"
              class="dz-xy-0-0 dz-wh-15-80 dz-align-cc dz-c-FE dz-noptr"></div>
        </div>
      </div>
    </button>
    <button data-dz="button"
        data-name="sortByBtn"
        data-style="Empty"
        data-disabled="0"
        class="dz-xy-0-0 dz-wh-98-84 dz-tc-FE dz-tc-40454D">
      <span data-dz="text"
          data-name="DropdownText3"
          data-style="Normal"
          class="dz-xy-0-0 dz-wh-62-100 dz-align-y-center dz-tc-FE dz-tc-8E dz-font-body-16 dz-noptr dz-text-vc">
        #tpm_sort_by
      </span>
      <img data-dz="image"
          data-name="decroissantIcon"
          class="dz-xy-7-0 dz-wh-30px-30px dz-align-cr dz-c-FE dz-noptr dz-hidden"
          data-image="set:traderx_icons image:decroissant"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <img data-dz="image"
          data-name="croissantIcon"
          class="dz-xy-7-0 dz-wh-30px-30px dz-align-cr dz-c-FE dz-noptr"
          data-image="set:traderx_icons image:croissant"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
    </button>
  </div>
  <div data-dz="panel"
      data-name="PanelWidget6"
      data-style="TXSurface"
      class="dz-xy-3-21 dz-wh-15-75 dz-c-FE dz-noptr">
    <button data-dz="button"
        data-name="collapseBtn"
        data-style="Empty"
        class="dz-wh-98-84 dz-tc-FE dz-tc-40454D">
      <span data-dz="text"
          data-name="DropdownText0"
          data-style="Normal"
          class="dz-xy-0-0 dz-wh-62-100 dz-align-y-center dz-tc-FE dz-tc-8E dz-font-body-16 dz-noptr dz-text-vc">
        #tpm_collapse
      </span>
      <img data-dz="image"
          data-name="DropdownExpandIcon0"
          class="dz-xy-7-0 dz-wh-30px-21px dz-align-cr dz-c-FE dz-noptr"
          data-image="set:ccgui_enforce image:CrScrollV"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
    </button>
  </div>
</div>
<div data-dz="grid"
    data-name="licensePanel"
    data-style="Empty"
    class="dz-wh-31-87 dz-align-cc dz-c-FE dz-noptr dz-hidden dz-fit-h dz-cols-2 dz-rows-1 dz-pad-10">
  <img data-dz="image"
      data-name="ImageWidget0"
      class="dz-xy-2-0 dz-wh-36px-36px dz-align-y-center dz-c-D8D2C0 dz-noptr"
      data-image="set:traderx_icons image:padlock"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  <span data-dz="text"
      data-name="TextWidget1"
      class="dz-xy-10-0 dz-wh-90-100 dz-align-y-center dz-c-D8D2C0 dz-font-heading-28 dz-noptr dz-exact-text dz-text-vc dz-size-to-text">
    #tpm_licenses_required
  </span>
</div>
<span data-dz="text"
    data-name="itemCountText"
    class="dz-xy-1-0 dz-wh-9-100 dz-align-cr dz-tc-0F dz-font-mono-28 dz-noptr dz-exact-text dz-text-vc dz-text-right dz-size-to-text-h">
  146 items
</span>
<div data-dz="grid"
    data-name="itemCardGrid"
    class="dz-wh-100-56px dz-align-x-center dz-noptr dz-fit-v dz-cols-6 dz-rows-100 dz-gap-4"></div>

<script src="dzml-runtime.js?v=1780762084981"></script>
</body>
</html>
