<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="grid"
    data-name="CategoryCardLargeView"
    data-style="Colorable"
    data-disabled="0"
    class="dz-wh-100-62px dz-align-x-center dz-c-FE dz-noptr dz-fit-v dz-cols-1 dz-rows-2">
  <button data-dz="button"
      data-name="categoryCardBtn"
      data-style="TXCardElevated"
      data-user-id="252"
      data-disabled="0"
      class="dz-xy-0-0 dz-wh-1920px-68px dz-align-cc dz-tc-FE dz-tc-555A65">
    <div data-dz="panel"
        data-name="categoryGrid"
        data-style="blank"
        class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr">
      <img data-dz="image"
          data-name="categoryIcon"
          class="dz-xy-1-0 dz-wh-62px-62px dz-align-y-center dz-noptr"
          data-image="set:traderx_icons image:rifle"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <span data-dz="text"
          data-name="categoryNameText"
          data-style="Normal"
          class="dz-xy-6--1 dz-wh-81-91 dz-align-y-center dz-tc-FE dz-tc-1D dz-font-heading-28 dz-noptr dz-text-vc">
        Category Name
      </span>
      <div data-dz="grid"
          data-name="ContainerPanelBtn"
          class="dz-xy-0-0 dz-wh-36-100 dz-align-cr dz-noptr dz-fit-h dz-cols-2 dz-rows-1 dz-pad-10 dz-gap-7"></div>
    </div>
  </button>
  <button data-dz="button"
      data-name="sortByBtn"
      data-style="TXCardElevated"
      class="dz-xy-2-0 dz-wh-33-75 dz-align-cr dz-tc-FE dz-tc-40454D">
    <span data-dz="text"
        data-name="sortByText"
        data-style="Normal"
        class="dz-xy-0-0 dz-wh-62-100 dz-align-y-center dz-tc-FE dz-tc-8E dz-font-body-16 dz-noptr dz-text-vc">
      #tpm_sort_by
    </span>
    <img data-dz="image"
        data-name="croissantIcon"
        class="dz-xy-7-0 dz-wh-30px-30px dz-align-cr dz-c-FE dz-noptr"
        data-image="set:traderx_icons image:croissant"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="decroissantIcon"
        class="dz-xy-7-0 dz-wh-30px-30px dz-align-cr dz-c-FE dz-noptr dz-hidden"
        data-image="set:traderx_icons image:decroissant"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
</div>
<div data-dz="grid"
    data-name="itemCardGrid"
    class="dz-xy-10px-10px dz-wh-48px-48px dz-noptr dz-fit-v dz-rows-100 dz-pad-7 dz-gap-5"></div>

<script src="dzml-runtime.js?v=1780762085237"></script>
</body>
</html>
