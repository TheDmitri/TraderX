<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="grid"
    data-name="categoryCard"
    class="dz-xy-0-0 dz-wh-100-1 dz-noptr dz-fit-v dz-cols-1 dz-rows-100">
  <div data-dz="panel"
      data-name="categoryHeader"
      class="dz-xy-0-0 dz-wh-100-54px dz-noptr">
    <div data-dz="panel"
        data-name="categoryCardPanel"
        data-style="TXCard"
        class="dz-xy-0-0 dz-wh-100-52px dz-c-FE dz-noptr"></div>
    <button data-dz="button"
        data-name="categoryBtn"
        data-style="TXCategoryRow"
        data-on-click="OnCategoryCardClick"
        class="dz-xy-0-0 dz-wh-100-52px dz-tc-FE"></button>
    <img data-dz="image"
        data-name="categoryIcon"
        class="dz-xy-1-11px dz-wh-30px-30px dz-c-C4A35A dz-noptr"
        data-image="set:traderx_icons image:grid"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="favStarIcon"
        class="dz-xy-1-11px dz-wh-30px-30px dz-c-C4A35A dz-noptr dz-hidden"
        data-image="set:traderx_icons image:star"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="CategoryName"
        data-bind="{{ category_name }}"
        class="dz-xy-5-0 dz-wh-50-52px dz-tc-D8D2C0 dz-font-body-16 dz-noptr dz-bold dz-exact-text dz-text-vc">
      Category Name
    </span>
    <span data-dz="text"
        data-name="itemCountText"
        data-bind="{{ item_count }}"
        class="dz-xy-56-0 dz-wh-24-52px dz-tc-6A6560 dz-font-mono-12 dz-noptr dz-exact-text dz-text-vc dz-text-right">
      146 items
    </span>
    <div data-dz="panel"
        data-name="dropdownParentPanel"
        class="dz-xy-82-0 dz-wh-18-52px dz-noptr">
      <button data-dz="button"
          data-name="sortByBtn"
          data-style="TXBtnIcon"
          data-on-click="OnSortClick"
          class="dz-xy-10-11px dz-wh-30px-30px dz-tc-FE dz-tc-D8D2C0 dz-font-body-14 dz-exact-text">
        <img data-dz="image"
            data-name="croissantIcon"
            class="dz-xy-0-0 dz-wh-90-90 dz-align-cc dz-c-D8D2C0 dz-noptr"
            data-image="set:traderx_icons image:croissant"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
        <img data-dz="image"
            data-name="decroissantIcon"
            class="dz-xy-0-0 dz-wh-90-90 dz-align-cc dz-c-D8D2C0 dz-noptr dz-hidden"
            data-image="set:traderx_icons image:decroissant"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
      </button>
      <button data-dz="button"
          data-name="collapseBtn"
          data-style="TXBtnIcon"
          data-on-click="OnCollapseClick"
          class="dz-xy-55-11px dz-wh-30px-30px dz-tc-FE dz-tc-D8D2C0 dz-font-body-16 dz-exact-text">
        <img data-dz="image"
            data-name="collapseBtnIcon"
            class="dz-xy-0-0 dz-wh-55-55 dz-align-cc dz-noptr"
            data-image="set:traderx_icons image:chevron_down"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
      </button>
    </div>
    <div data-dz="panel"
        data-name="licensePanel"
        data-style="TXErrorBox"
        class="dz-xy-0-0 dz-wh-100-52px dz-c-FE dz-noptr dz-hidden">
      <img data-dz="image"
          data-name="lockIcon"
          class="dz-xy-34-0 dz-wh-36px-36px dz-align-y-center dz-c-D8D2C0 dz-noptr"
          data-image="set:traderx_icons image:padlock"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <span data-dz="text"
          data-name="lockText"
          class="dz-xy-41-0 dz-wh-50-100 dz-align-y-center dz-c-D8D2C0 dz-font-heading-22 dz-noptr dz-text-vc dz-exact-text dz-size-to-text-h">
        #tpm_licenses_required
      </span>
    </div>
  </div>
  <div data-dz="grid"
      data-name="itemCardGridList"
      data-foreach="{{ _inputItemProducts }}"
      data-template="tx-item-card-small"
      data-item="_inputProduct"
      class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100 dz-gap-4"></div>
  <div data-dz="grid"
      data-name="itemCardGridTiles"
      data-foreach="{{ _inputItemProducts }}"
      data-template="tx-item-card-large"
      data-item="_inputProduct"
      class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-4 dz-rows-100 dz-gap-6"></div>
</div>

<script src="dzml-runtime.js?v=1780762084461"></script>
</body>
</html>
