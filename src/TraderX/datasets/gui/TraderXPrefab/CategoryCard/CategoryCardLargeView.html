<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1094px; height:700px; background:#13100c;">

<!-- Category section (Nasdara): Anton title + item count, sort button on the right,
     then the product tiles (4 columns) or the list rows. On the purchase and favorites
     pages the section stays expanded (CategoryCardComponent.m_AlwaysExpanded). -->
<div data-dz="grid"
    data-name="categoryCard"
    class="dz-xy-0-0 dz-wh-100-1 dz-noptr dz-fit-v dz-cols-1 dz-rows-100 dz-gap-22">
  <div data-dz="panel"
      data-name="categoryHeader"
      class="dz-xy-0-0 dz-wh-100-60px dz-noptr">
    <div data-dz="panel"
        data-name="categoryCardPanel"
        class="dz-xy-0-0 dz-wh-full dz-c-13100C00 dz-noptr"></div>
    <button data-dz="button"
        data-name="categoryBtn"
        data-style="Empty"
        data-on-click="OnCategoryCardClick"
        class="dz-xy-0-0 dz-wh-70-60px dz-tc-FE"></button>
    <img data-dz="image"
        data-name="categoryIcon"
        class="dz-xy-0-0 dz-wh-1px-1px dz-c-00000000 dz-noptr dz-hidden"
        data-image="set:traderx_icons image:grid"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <div data-dz="wrap"
        data-name="categoryTitleRow"
        class="dz-xy-0-0 dz-wh-75-60px dz-noptr dz-gap-19">
      <img data-dz="image"
          data-name="favStarIcon"
          class="dz-wh-30px-56px dz-c-E0A33A dz-noptr dz-hidden"
          data-image="set:traderx_icons image:star_full"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <span data-dz="text"
          data-name="CategoryName"
          data-bind="{{ category_name | uppercase }}"
          class="dz-wh-1px-57px dz-c-F2E9D8 dz-font-nh-41 dz-noptr dz-exact-text dz-text-vb dz-size-to-text-h">
        PACKAGED FOOD
      </span>
      <!-- the game ignores "text valign bottom": a two-row column puts the count in the
           lower half, on the title's baseline -->
      <div data-dz="grid"
          data-name="itemCountCol"
          class="dz-wh-1px-54px dz-noptr dz-cols-1 dz-rows-2 dz-fit-h">
        <div data-dz="panel"
            data-name="itemCountPad"
            class="dz-wh-1px-27px dz-c-00000000 dz-noptr"></div>
        <span data-dz="text"
            data-name="itemCountText"
            data-bind="{{ item_count }}"
            class="dz-wh-1px-27px dz-c-A39276 dz-font-nbb-18 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
          10 items
        </span>
      </div>
    </div>
    <div data-dz="panel"
        data-name="dropdownParentPanel"
        class="dz-xy-120px-1px dz-wh-150px-43px dz-align-x-right dz-noptr">
      <button data-dz="button"
          data-name="sortByBtn"
          data-style="TXBtnDefault"
          data-on-click="OnSortClick"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE">
        <span data-dz="text"
            data-name="sortLabel"
            class="dz-xy-17px-0 dz-wh-80px-43px dz-c-C2B59C dz-font-nbb-17 dz-noptr dz-exact-text dz-text-vc">
          #tpm_price
        </span>
        <img data-dz="image"
            data-name="croissantIcon"
            class="dz-xy-17px-0 dz-wh-17px-17px dz-align-cr dz-c-C2B59C dz-noptr"
            data-image="set:traderx_icons image:chevron_down"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
        <img data-dz="image"
            data-name="decroissantIcon"
            class="dz-xy-17px-0 dz-wh-17px-17px dz-align-cr dz-c-C2B59C dz-rotation-180 dz-noptr dz-hidden"
            data-image="set:traderx_icons image:chevron_down"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
      </button>
      <button data-dz="button"
          data-name="collapseBtn"
          data-style="Empty"
          data-on-click="OnCollapseClick"
          class="dz-xy-0-0 dz-wh-1px-1px dz-tc-FE dz-hidden"></button>
    </div>
    <!-- Licence-locked category: Deep 60% veil + "Licenses Required: …" in Bad. -->
    <div data-dz="panel"
        data-name="licenseDimPanel"
        class="dz-xy-0-0 dz-wh-full dz-c-0F0D0A99 dz-noptr dz-hidden"></div>
    <div data-dz="panel"
        data-name="licensePanel"
        class="dz-xy-290px-0 dz-wh-420px-60px dz-align-x-right dz-noptr dz-hidden">
      <img data-dz="image"
          data-name="lockIcon"
          class="dz-xy-0-0 dz-wh-18px-18px dz-align-y-center dz-c-E07A63 dz-noptr"
          data-image="set:traderx_icons image:padlock"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <span data-dz="text"
          data-name="lockText"
          data-bind="{{ license_text }}"
          class="dz-xy-26px-0 dz-wh-390px-60px dz-c-E07A63 dz-font-nbb-17 dz-noptr dz-exact-text dz-text-vc">
        Licenses Required: Car Licence
      </span>
    </div>
  </div>
  <div data-dz="grid"
      data-name="itemCardGridList"
      data-foreach="{{ _inputItemProducts }}"
      data-template="tx-item-card-small"
      data-item="_inputProduct"
      class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100 dz-gap-5"></div>
  <div data-dz="grid"
      data-name="itemCardGridTiles"
      data-foreach="{{ _inputItemProducts }}"
      data-template="tx-item-card-large"
      data-item="_inputProduct"
      class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-4 dz-rows-100 dz-gap-17"></div>
</div>

<script src="dzml-runtime.js?v=1780762084461"></script>
</body>
</html>
