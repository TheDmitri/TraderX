<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1406px; height:400px; background:#13100c;">

<!-- Catalog section (Nasdara): a 60 px Surface header (ember icon, name, count, sort,
     chevron) that expands into rows or tiles. -->
<div data-dz="grid"
    data-name="categoryCard"
    class="dz-xy-0-0 dz-wh-100-1 dz-noptr dz-fit-v dz-cols-1 dz-rows-100 dz-gap-5">
  <div data-dz="panel"
      data-name="categoryHeader"
      class="dz-xy-0-0 dz-wh-100-60px dz-noptr">
    <div data-dz="panel"
        data-name="categoryCardPanel"
        data-style="TXCard"
        class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
    <button data-dz="button"
        data-name="categoryBtn"
        data-style="Empty"
        data-on-click="OnCategoryCardClick"
        class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
    <img data-dz="image"
      data-name="categoryIcon"
      class="dz-xy-22px-0 dz-wh-24px-24px dz-align-y-center dz-c-D9762F dz-noptr"
      data-image="set:traderx_icons image:grid"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="CategoryName"
        data-bind="{{ category_name }}"
        class="dz-xy-65px-0 dz-wh-600px-60px dz-c-F2E9D8 dz-font-nbb-22 dz-noptr dz-exact-text dz-text-vc">
      Category Name
    </span>
    <span data-dz="text"
        data-name="itemCountText"
        data-bind="{{ item_count }}"
        class="dz-xy-130px-0 dz-wh-200px-60px dz-align-x-right dz-c-A39276 dz-font-nm-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
      146 items
    </span>
    <div data-dz="panel"
        data-name="dropdownParentPanel"
        class="dz-xy-14px-0 dz-wh-100px-60px dz-align-x-right dz-noptr">
      <button data-dz="button"
          data-name="sortByBtn"
          data-style="TXBtnIcon"
          data-on-click="OnSortClick"
          class="dz-xy-0-0 dz-wh-38px-38px dz-align-y-center dz-tc-FE">
        <img data-dz="image"
      data-name="croissantIcon"
      class="dz-xy-0-0 dz-wh-17px-17px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:croissant"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
        <img data-dz="image"
      data-name="decroissantIcon"
      class="dz-xy-0-0 dz-wh-17px-17px dz-align-cc dz-c-C2B59C dz-noptr dz-hidden"
      data-image="set:traderx_icons image:decroissant"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
      </button>
      <button data-dz="button"
          data-name="collapseBtn"
          data-style="TXBtnIcon"
          data-on-click="OnCollapseClick"
          class="dz-xy-48px-0 dz-wh-38px-38px dz-align-y-center dz-tc-FE">
        <img data-dz="image"
      data-name="collapseBtnIcon"
      class="dz-xy-0-0 dz-wh-17px-17px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:chevron_down"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
      </button>
    </div>
    <!-- Licence-locked category: Deep 60% veil + padlock and the licence names in Bad. -->
    <div data-dz="panel"
        data-name="licenseDimPanel"
        class="dz-xy-0-0 dz-wh-full dz-c-0F0D0A99 dz-noptr dz-hidden"></div>
    <div data-dz="panel"
        data-name="licensePanel"
        class="dz-xy-360px-0 dz-wh-420px-60px dz-align-x-right dz-noptr dz-hidden">
      <img data-dz="image"
      data-name="lockIcon"
      class="dz-xy-0-0 dz-wh-18px-18px dz-align-y-center dz-c-E07A63 dz-noptr"
      data-image="set:traderx_icons image:padlock"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
      <span data-dz="text"
          data-name="lockText"
          data-bind="{{ license_text }}"
          class="dz-xy-26px-0 dz-wh-390px-60px dz-c-E07A63 dz-font-nbb-17 dz-noptr dz-exact-text dz-text-vc">
        Licenses Required: Car Licence
      </span>
    </div>
  </div>
  <div data-dz="grid"
      data-name="itemCardGridList"
      data-foreach="{{ _inputCatalogProducts }}"
      data-template="tx-catalog-item-card"
      data-item="_inputProduct"
      class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-1 dz-rows-100 dz-gap-5"></div>
  <div data-dz="grid"
      data-name="itemCardGridTiles"
      data-foreach="{{ _inputCatalogProducts }}"
      data-template="tx-catalog-item-card-grid"
      data-item="_inputProduct"
      class="dz-xy-0-0 dz-wh-100-1 dz-fit-v dz-cols-5 dz-rows-100 dz-gap-17"></div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
