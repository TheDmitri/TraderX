<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:260px; height:236px; background:#13100c;">

<!-- Product tile (Nasdara): Surface card, Line border (ember when in the cart),
     Deep preview well with the 3D preview, star top-right, "IN CART · n" badge top-left,
     name, price in ember + "sells for" on the right. Stock / health / volume / customize
     shortcuts stay as small marks in the well. -->
<div data-dz="panel"
    data-name="itemCardView"
    class="dz-xy-0-0 dz-wh-100-236px dz-noptr">
  <div data-dz="panel"
      data-name="itemCardBase"
      class="dz-xy-0-0 dz-wh-full dz-c-1C1813 dz-noptr"></div>
  <div data-dz="panel"
      data-name="previewWell"
      class="dz-xy-0-0 dz-wh-100-158px dz-c-0F0D0A dz-noptr"></div>
  <button data-dz="button"
      data-name="itemCardMainBtn"
      data-style="Empty"
      data-on-click="OnItemCardLeftClick"
      data-on-dblclick="OnItemCardDoubleClick"
      data-on-rclick="OnItemCardRightClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="itemCardContent"
      class="dz-xy-0-0 dz-wh-full dz-c-00000000 dz-noptr">
    <div data-dz="preview"
        data-name="itemPreview"
        data-bind-item="{{ preview }}"
        class="dz-xy-0-14px dz-wh-80-130px dz-align-x-center dz-noptr dz-clip"></div>
    <button data-dz="button"
        data-name="volumeBtn"
        data-style="Default"
        class="dz-xy-6px-40px dz-wh-5px-90px dz-tc-FE">
      <progress data-dz="progress"
          data-name="volumeBar"
          data-style="TXProgressFill"
          class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></progress>
    </button>
    <div data-dz="grid"
        data-name="stockGrid"
        class="dz-xy-12px-132px dz-wh-120px-18px dz-noptr dz-cols-2 dz-rows-1 dz-gap-5 dz-fit-h">
      <img data-dz="image"
          data-name="stockIcon"
          class="dz-wh-16px-16px dz-c-A39276 dz-noptr"
          data-image="set:traderx_icons image:stockSimple"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <span data-dz="text"
          data-name="stockText"
          data-bind="{{ itemStock }}"
          class="dz-wh-1px-18px dz-c-A39276 dz-font-nm-14 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
        0/15
      </span>
    </div>
    <img data-dz="image"
        data-name="healthImg"
        class="dz-xy-12px-136px dz-wh-10px-10px dz-align-x-right dz-c-7FA65A dz-noptr"
        data-image="set:traderx_icons image:circle"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="unselectedIcon"
        class="dz-xy-0-0 dz-wh-1px-1px dz-c-00000000 dz-noptr dz-hidden"
        data-image="set:traderx_icons image:unapproved"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="selectedIcon"
        class="dz-xy-0-0 dz-wh-1px-1px dz-c-00000000 dz-noptr dz-hidden"
        data-image="set:traderx_icons image:approved"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="classNameText"
        data-bind="{{ itemName }}"
        class="dz-xy-14px-170px dz-wh-88-24px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-text-vc">
      Item Name
    </span>
    <span data-dz="text"
        data-name="quantityStr"
        data-bind="{{ quantityStr }}"
        class="dz-xy-14px-172px dz-wh-30-20px dz-align-x-right dz-c-A39276 dz-font-nm-14 dz-noptr dz-exact-text dz-text-vc dz-text-right"></span>
    <span data-dz="text"
        data-name="priceText"
        data-bind="{{ price_display }}"
        class="dz-xy-14px-200px dz-wh-50-26px dz-c-E8894A dz-font-nm-22 dz-noptr dz-exact-text dz-text-vc">
      € 5
    </span>
    <span data-dz="text"
        data-name="sellPriceText"
        data-bind="{{ itemSellPrice }}"
        class="dz-xy-14px-202px dz-wh-55-22px dz-align-x-right dz-c-A39276 dz-font-nb-16 dz-noptr dz-exact-text dz-text-vc dz-text-right">
      sells for € 2
    </span>
  </div>
  <!-- in the cart: ember ring + badge -->
  <div data-dz="panel"
      data-name="itemCardFrame"
      data-style="TXFrame"
      class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
  <div data-dz="panel"
      data-name="itemCardOutline"
      data-style="TXCardSelected"
      class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
  <div data-dz="panel"
      data-name="inCartBadge"
      class="dz-xy-10px-10px dz-wh-124px-22px dz-c-D9762F dz-noptr dz-hidden">
    <span data-dz="text"
        data-name="inCartText"
        data-bind="{{ cart_badge }}"
        class="dz-xy-0-0 dz-wh-full dz-c-1A0D04 dz-font-nbb-14 dz-noptr dz-exact-text dz-text-center dz-text-vc">
      IN CART · 2
    </span>
  </div>
  <!-- Licence-locked product: Deep 60% veil + padlock (dz-noptr, the card stays inspectable). -->
  <div data-dz="panel"
      data-name="licenseDimPanel"
      class="dz-xy-0-0 dz-wh-full dz-c-0F0D0A99 dz-noptr dz-hidden"></div>
  <img data-dz="image"
      data-name="licenseLockIcon"
      class="dz-xy-12px-12px dz-wh-24px-24px dz-c-E07A63 dz-noptr dz-hidden"
      data-image="set:traderx_icons image:padlock"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  <!-- Hover catcher over the preview well (description tooltip on image hover only);
       must come before the star and the customize shortcuts so those stay clickable. -->
  <button data-dz="button"
      data-name="previewHoverBtn"
      data-style="Empty"
      data-on-click="OnItemCardLeftClick"
      data-on-dblclick="OnItemCardDoubleClick"
      data-on-rclick="OnItemCardRightClick"
      data-on-mouseenter="OnItemCardMouseEnter"
      data-on-mouseleave="OnItemCardMouseLeave"
      class="dz-xy-0-40px dz-wh-100-118px dz-c-00000000 dz-tc-FE"></button>
  <button data-dz="button"
      data-name="favBtn"
      data-style="Empty"
      data-on-click="OnItemFavClick"
      class="dz-xy-7px-7px dz-wh-38px-38px dz-align-x-right dz-tc-FE">
    <img data-dz="image"
        data-name="favIcon"
        class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-E0A33A dz-noptr"
        data-image="set:traderx_icons image:star_full"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="unfavIcon"
        class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-8C7D66 dz-noptr dz-hidden"
        data-image="set:traderx_icons image:star"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <!-- Customize shortcuts (shown from ItemCardComponent.UpdateCustomizeAffordance) -->
  <button data-dz="button"
      data-name="customizeBtn"
      data-style="Empty"
      data-on-click="OnCustomizeClick"
      data-on-mouseenter="OnCustomizeEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-48px-7px dz-wh-38px-38px dz-align-x-right dz-tc-FE dz-hidden">
    <img data-dz="image"
        data-name="customizeIcon"
        class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
        data-image="set:traderx_icons image:gear"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="attachBtn"
      data-style="Empty"
      data-on-click="OnAttachClick"
      data-on-mouseenter="OnAttachEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-86px-7px dz-wh-38px-38px dz-align-x-right dz-tc-FE dz-hidden">
    <img data-dz="image"
        data-name="attachIcon"
        class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
        data-image="set:traderx_icons image:wrench"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="variantBtn"
      data-style="Empty"
      data-on-click="OnVariantClick"
      data-on-mouseenter="OnVariantEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-124px-7px dz-wh-38px-38px dz-align-x-right dz-tc-FE dz-hidden">
    <img data-dz="image"
        data-name="variantIcon"
        class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
        data-image="set:traderx_icons image:palette"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
</div>

<script src="dzml-runtime.js?v=1780762084461"></script>
</body>
</html>
