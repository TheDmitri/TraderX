<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:720px; height:300px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="itemCardView"
    class="dz-xy-0-0 dz-wh-100-300px dz-noptr">
  <div data-dz="panel"
      data-name="itemCardOutline"
      data-style="TXCardElevated"
      class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
  <button data-dz="button"
      data-name="itemCardMainBtn"
      data-style="Empty"
      data-on-click="OnItemCardLeftClick"
      data-on-dblclick="OnItemCardDoubleClick"
      data-on-rclick="OnItemCardRightClick"
      data-on-mouseenter="OnItemCardMouseEnter"
      data-on-mouseleave="OnItemCardMouseLeave"
      class="dz-xy-1-1 dz-wh-98-98 dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="itemCardContent"
      class="dz-xy-1-1 dz-wh-98-98 dz-c-00000000 dz-noptr">
    <button data-dz="button"
        data-name="volumeBtn"
        data-style="Default"
        class="dz-xy-1-14 dz-wh-9px-66 dz-tc-FE">
      <progress data-dz="progress"
          data-name="volumeBar"
          data-style="TXProgressFill"
          class="dz-xy-0-40 dz-wh-100-60 dz-c-FE dz-noptr"></progress>
    </button>
    <div data-dz="panel"
        data-name="previewWell"
        class="dz-xy-4-3 dz-wh-92-54 dz-c-06070A dz-noptr"></div>
    <div data-dz="preview"
        data-name="itemPreview"
        data-bind-item="{{ preview }}"
        class="dz-xy-4-5 dz-wh-92-50 dz-noptr dz-clip"></div>
    <img data-dz="image"
        data-name="healthImg"
        class="dz-xy-8-5 dz-wh-12px-12px dz-c-6B8E5A dz-noptr"
        data-image="set:traderx_icons image:circle"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <div data-dz="grid"
        data-name="stockGrid"
        class="dz-xy-50-3 dz-wh-46-32px dz-noptr dz-cols-2 dz-rows-1 dz-gap-6 dz-fit-h">
      <img data-dz="image"
          data-name="stockIcon"
          class="dz-wh-32px-32px dz-c-9A9488 dz-noptr"
          data-image="set:traderx_icons image:stockSimple"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <span data-dz="text"
          data-name="stockText"
          data-bind="{{ itemStock }}"
          class="dz-c-9A9488 dz-font-mono-22 dz-noptr dz-bold dz-exact-text dz-text-vc dz-size-to-text-h">
        0/15
      </span>
    </div>
    <img data-dz="image"
        data-name="unselectedIcon"
        class="dz-xy-4-4 dz-wh-32px-32px dz-c-00000000 dz-noptr"
        data-image="set:traderx_icons image:unapproved"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="selectedIcon"
        class="dz-xy-4-4 dz-wh-32px-32px dz-c-6B8E5A dz-noptr dz-hidden"
        data-image="set:traderx_icons image:approved"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <div data-dz="panel"
        data-name="infoStrip"
        data-style="TXSurface"
        class="dz-xy-0-58 dz-wh-100-42 dz-c-FE dz-noptr">
      <span data-dz="text"
          data-name="classNameText"
          data-bind="{{ itemName }}"
          class="dz-xy-6-6 dz-wh-88-30 dz-c-D8D2C0 dz-font-body-16 dz-noptr dz-bold dz-exact-text dz-text-center">
        Item Name
      </span>
      <div data-dz="grid"
          data-name="priceGrid"
          class="dz-xy-28-46 dz-wh-40-32 dz-noptr dz-cols-2 dz-rows-1 dz-gap-6 dz-fit-h">
        <img data-dz="image"
            data-name="priceIcon"
            class="dz-xy-28-46 dz-wh-32px-32px dz-c-C4A35A dz-noptr"
            data-image="set:traderx_icons image:simpleCoins"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
        <span data-dz="text"
            data-name="priceText"
            data-bind="{{ itemPrice }}"
            class="dz-xy-38-42 dz-wh-36-40 dz-c-C4A35A dz-font-mono-22 dz-noptr dz-bold dz-exact-text dz-text-vc dz-size-to-text-h">
            1,250
        </span>
      </div>
      <span data-dz="text"
          data-name="quantityStr"
          data-bind="{{ quantityStr }}"
          class="dz-xy-6-74 dz-wh-30-22 dz-c-6A6560 dz-font-mono-12 dz-noptr dz-exact-text dz-text-vc"></span>
    </div>
  </div>
  <button data-dz="button"
      data-name="favBtn"
      data-style="Empty"
      data-on-click="OnItemFavClick"
      class="dz-xy-86-4 dz-wh-26px-26px dz-tc-FE">
    <img data-dz="image"
        data-name="favIcon"
        class="dz-xy-0-0 dz-wh-full dz-c-C4A35A dz-noptr"
        data-image="set:traderx_icons image:star_full"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="unfavIcon"
        class="dz-xy-0-0 dz-wh-full dz-c-9A9488 dz-noptr dz-hidden"
        data-image="set:traderx_icons image:star"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
</div>

<script src="dzml-runtime.js?v=1780762086563"></script>
</body>
</html>
