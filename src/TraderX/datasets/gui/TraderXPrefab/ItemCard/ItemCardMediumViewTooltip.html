<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="itemCardView"
    data-style="TXCard"
    class="dz-xy-0-0 dz-wh-238px-136px dz-c-FE dz-disabled">
  <div data-dz="panel"
      data-name="itemCardOutline"
      data-style="TXCardSelected"
      class="dz-xy-0-0 dz-wh-full dz-align-cc dz-c-FE dz-noptr">
    <button data-dz="button"
        data-name="itemCardMainBtn"
        data-style="Empty"
        data-user-id="301"
        class="dz-xy-0-0 dz-wh-97-96 dz-align-cc dz-tc-FE">
      <div data-dz="panel"
          data-name="itemCardContent"
          data-style="TXSurface"
          data-disabled="0"
          class="dz-xy-1-1 dz-wh-full dz-align-cc dz-c-FE dz-noptr">
        <div data-dz="preview"
            data-name="itemPreview"
            class="dz-xy-0--5 dz-wh-64-42 dz-align-cc dz-noptr"></div>
      </div>
    </button>
    <button data-dz="button"
        data-name="favBtn0"
        data-style="Empty"
        data-user-id="300"
        class="dz-xy-2--1 dz-wh-20px-32px dz-tc-FE">
      <img data-dz="image"
          data-name="favIcon"
          class="dz-xy-0-0 dz-wh-full dz-align-cc dz-c-FE dz-noptr dz-hidden"
          data-image="set:traderx_icons image:star_full"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
      <img data-dz="image"
          data-name="unfavIcon"
          class="dz-xy-0-0 dz-wh-full dz-align-x-center dz-c-FE dz-noptr"
          data-image="set:traderx_icons image:star"
          data-image-mode="blend"
          data-image-src-alpha="1"
          data-image-stretch="stretch_w_h"/>
    </button>
    <img data-dz="image"
        data-name="stockIcon"
        class="dz-xy-8-17 dz-wh-12px-12px dz-align-y-bottom dz-noptr"
        data-image="set:traderx_icons image:ready_stock"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="stockText"
        class="dz-xy-8-8 dz-wh-23-7 dz-align-y-bottom dz-font-mono-14 dz-noptr dz-exact-text dz-text-vc dz-size-to-text-h">
      0/15
    </span>
    <img data-dz="image"
        data-name="priceIcon"
        class="dz-xy-8-17 dz-wh-16px-16px dz-align-br dz-noptr"
        data-image="set:traderx_icons image:simpleCoins"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="priceText"
        class="dz-xy-8-8 dz-wh-23-7 dz-align-br dz-font-mono-14 dz-noptr dz-exact-text dz-text-vc dz-text-right dz-size-to-text-h">
      5.000.000
    </span>
    <img data-dz="image"
        data-name="selectedIcon"
        class="dz-xy--1-17 dz-wh-16px-16px dz-align-bc dz-noptr dz-hidden"
        data-image="set:traderx_icons image:approved"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <img data-dz="image"
        data-name="unselectedIcon"
        data-disabled="0"
        class="dz-xy--1-17 dz-wh-16px-16px dz-align-bc dz-noptr dz-hidden"
        data-image="set:traderx_icons image:unapproved"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <p data-dz="richtext"
        data-name="classNameText"
        data-style="DayZNormal"
        class="dz-xy-7-1 dz-wh-81-19 dz-align-x-right dz-tc-FE dz-font-body-12 dz-noptr dz-wrap dz-exact-text dz-text-vc dz-text-right">
      M4A1 Polymer Handguard
    </p>
    <progress data-dz="progress"
        data-name="volumeBar"
        data-style="TXProgressFill"
        class="dz-xy-7--6 dz-wh-3-38 dz-align-y-center dz-c-FE dz-noptr"></progress>
    <img data-dz="image"
        data-name="healthImg"
        class="dz-xy-4-4 dz-wh-16px-16px dz-c-00FF00 dz-noptr dz-hidden"
        data-image="set:traderx_icons image:circle"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </div>
</div>

<script src="dzml-runtime.js?v=1780762087084"></script>
</body>
</html>
