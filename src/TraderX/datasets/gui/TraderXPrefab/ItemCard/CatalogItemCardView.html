<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="CatalogItemCardView"
    class="dz-xy-0-0 dz-wh-100-92px dz-noptr">
  <div data-dz="panel"
      data-name="itemCardOutline"
      data-style="TXCardElevated"
      class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
  <button data-dz="button"
      data-name="itemCardBtn"
      data-style="Empty"
      data-on-click="OnCatalogItemClick"
      data-on-dblclick="OnCatalogItemDoubleClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="previewBg"
      class="dz-xy-2-12 dz-wh-13-76 dz-c-12141A dz-noptr"></div>
  <div data-dz="preview"
      data-name="itemPreview"
      data-bind-item="{{ preview }}"
      class="dz-xy-2-12 dz-wh-13-76 dz-noptr dz-clip"></div>
  <span data-dz="text"
      data-name="itemName"
      data-bind="{{ itemName }}"
      class="dz-xy-17-14 dz-wh-48-40 dz-tc-D8D2C0 dz-font-body-16 dz-noptr dz-bold dz-exact-text dz-text-vc">
    Item Name
  </span>
  <span data-dz="text"
      data-name="itemStock"
      data-bind="{{ itemStock }}"
      class="dz-xy-17-56 dz-wh-48-32 dz-tc-9A9488 dz-font-body-12 dz-noptr dz-exact-text dz-text-vc">
    Stock: 12
  </span>
  <div data-dz="grid"
      data-name="priceGrid"
      class="dz-xy-66-0 dz-wh-30-100 dz-noptr dz-cols-2 dz-rows-1 dz-gap-6 dz-fit-h dz-fit-v dz-align-y-center">
    <img data-dz="image"
        data-name="priceIcon"
        class="dz-wh-28px-28px dz-c-C4A35A dz-noptr"
        data-image="set:traderx_icons image:simpleCoins"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="itemPrice"
        data-bind="{{ itemPrice }}"
        class="dz-c-C4A35A dz-font-mono-22 dz-noptr dz-bold dz-exact-text dz-text-vc dz-size-to-text-h">
      1,250
    </span>
  </div>
  <!-- Persistent customize affordance (labelled hover tooltips; gear opens customize).
       Shown/hidden from CatalogItemCardComponent.UpdateCustomizeAffordance(). -->
  <button data-dz="button"
      data-name="variantBtn"
      data-style="Empty"
      data-on-click="OnVariantClick"
      data-on-mouseenter="OnVariantEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-80-0 dz-wh-24px-24px dz-align-y-center dz-c-FE dz-tc-FE dz-hidden">
    <img data-dz="image"
        data-name="variantIcon"
        class="dz-xy-0-0 dz-wh-full dz-align-cc dz-c-9ACD32 dz-noptr"
        data-image="set:traderx_icons image:palette"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="attachBtn"
      data-style="Empty"
      data-on-click="OnAttachClick"
      data-on-mouseenter="OnAttachEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-86-0 dz-wh-24px-24px dz-align-y-center dz-c-FE dz-tc-FE dz-hidden">
    <img data-dz="image"
        data-name="attachIcon"
        class="dz-xy-0-0 dz-wh-full dz-align-cc dz-c-C4A35A dz-noptr"
        data-image="set:traderx_icons image:wrench"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="customizeBtn"
      data-style="Empty"
      data-on-click="OnCustomizeClick"
      data-on-mouseenter="OnCustomizeEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-92-0 dz-wh-24px-24px dz-align-y-center dz-c-FE dz-tc-FE dz-hidden">
    <img data-dz="image"
        data-name="customizeIcon"
        class="dz-xy-0-0 dz-wh-full dz-align-cc dz-c-D8D2C0 dz-noptr"
        data-image="set:traderx_icons image:gear"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
