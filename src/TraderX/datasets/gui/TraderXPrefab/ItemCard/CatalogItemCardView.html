<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1406px; height:80px; background:#13100c;">

<!-- Catalog row (Nasdara): preview well, name + stock, sell price in ember, customize
     shortcuts on the right. -->
<div data-dz="panel"
    data-name="CatalogItemCardView"
    data-style="TXRowRule"
    class="dz-xy-0-0 dz-wh-100-80px dz-c-FE dz-noptr">
  <div data-dz="panel"
      data-name="itemCardOutline"
      data-style="TXCardSelected"
      class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr dz-hidden"></div>
  <button data-dz="button"
      data-name="itemCardBtn"
      data-style="TXListRow"
      data-on-click="OnCatalogItemClick"
      data-on-dblclick="OnCatalogItemDoubleClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="previewBg"
      class="dz-xy-12px-8px dz-wh-86px-64px dz-c-0F0D0A dz-noptr"></div>
  <div data-dz="preview"
      data-name="itemPreview"
      data-bind-item="{{ preview }}"
      class="dz-xy-12px-8px dz-wh-86px-64px dz-noptr dz-clip"></div>
  <span data-dz="text"
      data-name="itemName"
      data-bind="{{ itemName }}"
      class="dz-xy-118px-14px dz-wh-600px-28px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-text-vc">
    Item Name
  </span>
  <span data-dz="text"
      data-name="itemStock"
      data-bind="{{ itemStock }}"
      class="dz-xy-118px-44px dz-wh-600px-22px dz-c-A39276 dz-font-nm-14 dz-noptr dz-exact-text dz-text-vc">
    0/15
  </span>
  <span data-dz="text"
      data-name="itemPrice"
      data-bind="{{ itemPrice }}"
      class="dz-xy-160px-0 dz-wh-220px-80px dz-align-x-right dz-c-E8894A dz-font-nm-22 dz-noptr dz-exact-text dz-text-vc dz-text-right">
    € 1,250
  </span>
  <div data-dz="panel"
      data-name="licenseDimPanel"
      class="dz-xy-0-0 dz-wh-full dz-c-0F0D0A99 dz-noptr dz-hidden"></div>
  <img data-dz="image"
      data-name="licenseLockIcon"
      class="dz-xy-18px-14px dz-wh-18px-18px dz-c-E07A63 dz-noptr dz-hidden"
      data-image="set:traderx_icons image:padlock"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  <!-- Customize shortcuts (shown from CatalogItemCardComponent.UpdateCustomizeAffordance) -->
  <button data-dz="button"
      data-name="variantBtn"
      data-style="Empty"
      data-on-click="OnVariantClick"
      data-on-mouseenter="OnVariantEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-94px-0 dz-wh-38px-38px dz-align-x-right dz-align-y-center dz-tc-FE dz-hidden">
    <img data-dz="image"
      data-name="variantIcon"
      class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:palette"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="attachBtn"
      data-style="Empty"
      data-on-click="OnAttachClick"
      data-on-mouseenter="OnAttachEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-54px-0 dz-wh-38px-38px dz-align-x-right dz-align-y-center dz-tc-FE dz-hidden">
    <img data-dz="image"
      data-name="attachIcon"
      class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:wrench"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="customizeBtn"
      data-style="Empty"
      data-on-click="OnCustomizeClick"
      data-on-mouseenter="OnCustomizeEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-14px-0 dz-wh-38px-38px dz-align-x-right dz-align-y-center dz-tc-FE dz-hidden">
    <img data-dz="image"
      data-name="customizeIcon"
      class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:gear"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  </button>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
