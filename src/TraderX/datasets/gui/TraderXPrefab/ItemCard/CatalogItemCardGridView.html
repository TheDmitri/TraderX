<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<!-- Catalog item card, GRID/tiles mode — same aspect as the purchase item card
     (tx-item-card-large): elevated card, large preview, info strip with name +
     price. Browse only (no fav/select/volume). Bound to CatalogItemGridCardComponent.
     data-name contract → AutoLoadWidgets in CatalogItemCardComponent.c:
       itemCardContent, stockText, healthImg, itemCardMainBtn -->
<body data-dzml class="dz-viewport" style="width:268px; height:236px; background:#13100c;">

<!-- Catalog tile (Nasdara, same card as the purchase tile): preview well, name, stock,
     price in ember. -->
<div data-dz="panel"
    data-name="itemCardView"
    class="dz-xy-0-0 dz-wh-100-236px dz-noptr">
  <div data-dz="panel"
      data-name="itemCardBase"
      class="dz-xy-0-0 dz-wh-full dz-c-1C1813 dz-noptr"></div>
  <div data-dz="panel"
      data-name="previewWell"
      class="dz-xy-0-0 dz-wh-100-158px dz-c-0F0D0A dz-noptr"></div>
  <button data-dz="button"
      data-name="itemCardMainBtn"
      data-style="Empty"
      data-on-click="OnCatalogItemClick"
      data-on-dblclick="OnCatalogItemDoubleClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE"></button>
  <div data-dz="panel"
      data-name="itemCardContent"
      class="dz-xy-0-0 dz-wh-full dz-c-00000000 dz-noptr">
    <div data-dz="preview"
        data-name="itemPreview"
        data-bind-item="{{ preview }}"
        class="dz-xy-0-14px dz-wh-80-130px dz-align-x-center dz-noptr dz-clip"></div>
    <img data-dz="image"
      data-name="healthImg"
      class="dz-xy-12px-136px dz-wh-10px-10px dz-align-x-right dz-c-7FA65A dz-noptr dz-hidden"
      data-image="set:traderx_icons image:circle"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="stockText"
        data-bind="{{ itemStock }}"
        class="dz-xy-12px-132px dz-wh-150px-18px dz-c-A39276 dz-font-nm-14 dz-noptr dz-exact-text dz-text-vc">
      0/15
    </span>
    <span data-dz="text"
        data-name="itemName"
        data-bind="{{ itemName }}"
        class="dz-xy-14px-170px dz-wh-88-24px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-text-vc">
      Item Name
    </span>
    <span data-dz="text"
        data-name="itemPrice"
        data-bind="{{ itemPrice }}"
        class="dz-xy-14px-200px dz-wh-88-26px dz-c-E8894A dz-font-nm-22 dz-noptr dz-exact-text dz-text-vc">
      € 1,250
    </span>
  </div>
  <div data-dz="panel"
      data-name="itemCardOutline"
      data-style="TXFrame"
      class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
  <div data-dz="panel"
      data-name="licenseDimPanel"
      class="dz-xy-0-0 dz-wh-full dz-c-0F0D0A99 dz-noptr dz-hidden"></div>
  <img data-dz="image"
      data-name="licenseLockIcon"
      class="dz-xy-12px-12px dz-wh-24px-24px dz-c-E07A63 dz-noptr dz-hidden"
      data-image="set:traderx_icons image:padlock"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  <!-- Customize shortcuts (shown from CatalogItemCardComponent.UpdateCustomizeAffordance) -->
  <button data-dz="button"
      data-name="variantBtn"
      data-style="Empty"
      data-on-click="OnVariantClick"
      data-on-mouseenter="OnVariantEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-83px-7px dz-wh-38px-38px dz-align-x-right dz-tc-FE dz-hidden">
    <img data-dz="image"
      data-name="variantIcon"
      class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:palette"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="attachBtn"
      data-style="Empty"
      data-on-click="OnAttachClick"
      data-on-mouseenter="OnAttachEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-45px-7px dz-wh-38px-38px dz-align-x-right dz-tc-FE dz-hidden">
    <img data-dz="image"
      data-name="attachIcon"
      class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:wrench"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="customizeBtn"
      data-style="Empty"
      data-on-click="OnCustomizeClick"
      data-on-mouseenter="OnCustomizeEnter"
      data-on-mouseleave="OnAffordanceLeave"
      class="dz-xy-7px-7px dz-wh-38px-38px dz-align-x-right dz-tc-FE dz-hidden">
    <img data-dz="image"
      data-name="customizeIcon"
      class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-C2B59C dz-noptr"
      data-image="set:traderx_icons image:gear"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
  </button>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
