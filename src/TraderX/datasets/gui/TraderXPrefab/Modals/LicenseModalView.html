<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="modalRoot"
    class="dz-xy-0-0 dz-wh-full dz-align-cc dz-priority-999">
  <div data-dz="panel"
      data-name="backdrop"
      class="dz-xy-0-0 dz-wh-full dz-c-000000C8"></div>
  <div data-dz="panel"
      data-name="modalCard"
      data-style="TXCard"
      class="dz-xy-0-0 dz-wh-32-46 dz-align-cc dz-c-FE">
    <img data-dz="image"
        data-name="lockIcon"
        class="dz-xy-0-6 dz-wh-56px-56px dz-align-x-center dz-c-C8664A dz-noptr"
        data-image="set:traderx_icons image:padlock"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="title"
        data-bind="{{ title }}"
        class="dz-xy-0-24 dz-wh-100-12 dz-align-x-center dz-c-D8D2C0 dz-font-heading-22 dz-noptr dz-exact-text dz-text-center dz-text-vc">
      #tpm_licenses_required
    </span>
    <p data-dz="richtext"
        data-name="textContent"
        data-bind="{{ content }}"
        class="dz-xy-8-38 dz-wh-84-16 dz-c-A8B0A7 dz-font-body-16 dz-noptr dz-wrap dz-exact-text dz-text-center">
      Access restricted.
    </p>
    <p data-dz="richtext"
        data-name="licensesList"
        data-bind="{{ licensesList }}"
        class="dz-xy-8-56 dz-wh-84-26 dz-c-C4A35A dz-font-body-16 dz-noptr dz-wrap dz-bold dz-exact-text dz-text-center">
      - Car License
    </p>
    <button data-dz="button"
        data-name="closeBtn"
        data-style="TXBtnPrimary"
        data-on-click="OnCloseClick"
        class="dz-xy-30-86 dz-wh-40-10 dz-tc-FE">
      #tpm_close
    </button>
  </div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
