<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../../dzml.css">
  <link rel="stylesheet" href="../../dzml-styles.css">
  <link rel="stylesheet" href="../../dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#13100c;">

<!-- Nasdara modal: Deep 80% backdrop, Surface card with a Line border, Anton title. -->
<div data-dz="frame"
    data-name="modalRoot"
    class="dz-xy-0-0 dz-wh-full dz-align-cc">
  <div data-dz="panel"
      data-name="backdrop"
      class="dz-xy-0-0 dz-wh-full dz-c-0F0D0ACC"></div>
  <div data-dz="panel"
      data-name="modalCard"
      data-style="TXCard"
      class="dz-xy-0-0 dz-wh-600px-330px dz-align-cc dz-c-FE">
    <img data-dz="image"
        data-name="lockIcon"
        class="dz-xy-28px-30px dz-wh-29px-29px dz-c-E07A63 dz-noptr"
        data-image="set:traderx_icons image:padlock"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
    <span data-dz="text"
        data-name="title"
        data-bind="{{ title }}"
        class="dz-xy-70px-23px dz-wh-500px-42px dz-c-F2E9D8 dz-font-nh-29 dz-noptr dz-exact-text dz-text-vc">
      LICENSES REQUIRED
    </span>
    <div data-dz="richtext"
        data-name="textContent"
        data-bind="{{ content }}"
        class="dz-xy-28px-84px dz-wh-544px-60px dz-c-C2B59C dz-font-nb-19 dz-noptr dz-exact-text dz-wrap">
      You don't have the required license to access this trader.
    </div>
    <div data-dz="richtext"
        data-name="licensesList"
        data-bind="{{ licensesList }}"
        class="dz-xy-28px-150px dz-wh-544px-70px dz-c-E8894A dz-font-nbb-19 dz-noptr dz-exact-text dz-wrap">
      - Car Licence
    </div>
    <div data-dz="panel"
        data-name="closeBtnHost"
        class="dz-xy-28px-28px dz-wh-200px-53px dz-align-br dz-noptr">
      <button data-dz="button"
          data-name="closeBtn"
          data-style="TXBtnDefault"
          data-on-click="OnCloseClick"
          class="dz-xy-0-0 dz-wh-full dz-tc-FE">
        <span data-dz="text"
            data-name="closeBtnText"
            class="dz-xy-0-0 dz-wh-full dz-c-C2B59C dz-font-nh-20 dz-noptr dz-exact-text dz-text-center dz-text-vc">
          #tpm_close
        </span>
      </button>
    </div>
  </div>
</div>

<script src="../../dzml-runtime.js"></script>
</body>
</html>
