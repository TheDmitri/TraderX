<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:264px; height:210px; background:#1c1813;">
<!-- Inventory slots to sell from (Nasdara): 5 x 48 px tiles, ember icon on the active one. -->
<div data-dz="panel"
    data-name="PlayerSlotNavigation"
    class="dz-xy-0-0 dz-wh-full dz-noptr">
  <div data-dz="grid"
      data-name="slotNavGrid"
      data-foreach="{{ _inputNavBtnIds }}"
      data-template="tx-player-slot-btn"
      data-item="_inputSlot"
      class="dz-xy-0-0 dz-wh-100-1 dz-noptr dz-fit-v dz-cols-5 dz-rows-100 dz-gap-6"></div>
</div>
<script src="dzml-runtime.js"></script>
</body>
</html>
