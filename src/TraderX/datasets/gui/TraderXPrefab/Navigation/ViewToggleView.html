<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:96px; height:41px; background:#13100c;">

<!-- Grid / list segment (Nasdara): Line border, active half Raised + cream icon. -->
<div data-dz="panel"
    data-name="viewToggleRoot"
    class="dz-xy-0-0 dz-wh-96px-41px dz-noptr">
  <div data-dz="panel"
      data-name="gridBg"
      class="dz-xy-0-0 dz-wh-50-100 dz-c-262019 dz-noptr"></div>
  <div data-dz="panel"
      data-name="listBg"
      class="dz-xy-50-0 dz-wh-50-100 dz-c-262019 dz-noptr dz-hidden"></div>
  <button data-dz="button"
      data-name="gridBtn"
      data-style="Empty"
      data-on-click="OnGridClick"
      class="dz-xy-0-0 dz-wh-50-100 dz-tc-FE">
    <img data-dz="image"
        data-name="gridIcon"
        class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-F2E9D8 dz-noptr"
        data-image="set:traderx_icons image:grid"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="listBtn"
      data-style="Empty"
      data-on-click="OnListClick"
      class="dz-xy-50-0 dz-wh-50-100 dz-tc-FE">
    <img data-dz="image"
        data-name="listIcon"
        class="dz-xy-0-0 dz-wh-19px-19px dz-align-cc dz-c-A39276 dz-noptr"
        data-image="set:traderx_icons image:list"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <div data-dz="panel"
      data-name="viewToggleFrame"
      data-style="TXFrame"
      class="dz-xy-0-0 dz-wh-full dz-c-FE dz-noptr"></div>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
