<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:48px; height:48px; background:#1c1813;">
<!-- Slot tile (Nasdara): Raised icon button, item count top-right in mono, padlock when locked. -->
<div data-dz="panel"
    data-name="slotTile"
    class="dz-xy-0-0 dz-wh-48px-48px dz-noptr">
  <button data-dz="button"
      data-name="btnNav"
      data-style="TXBtnIcon"
      data-on-click="OnSlotClick"
      data-on-rclick="OnSlotRightClick"
      data-on-mouseenter="OnSlotMouseEnter"
      data-on-mouseleave="OnSlotMouseLeave"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE">
    <img data-dz="image"
        data-name="imgBtn"
        class="dz-xy-0-0 dz-wh-26px-26px dz-align-cc dz-c-A39276 dz-noptr"
        data-image="set:traderx_icons image:allStock"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <span data-dz="text"
      data-name="slotCount"
      data-bind="{{ itemCount }}"
      class="dz-xy-4px-2px dz-wh-40px-16px dz-align-x-right dz-c-E8894A dz-font-nm-13 dz-noptr dz-exact-text dz-text-right"></span>
  <img data-dz="image"
      data-name="imgLock"
      class="dz-xy-3px-3px dz-wh-13px-13px dz-align-br dz-c-E07A63 dz-noptr dz-hidden"
      data-image="set:traderx_icons image:padlock"
      data-image-mode="blend"
      data-image-src-alpha="1"
      data-image-stretch="stretch_w_h"/>
</div>
<script src="dzml-runtime.js"></script>
</body>
</html>
