<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<!-- Root is a size-to-content grid: each shown child is a stacked row, so the preset
     select bar and its expanded option list grow the card and the checkout list (also
     fit-v) reflows below. Rows: main row, preset select bar, option list.
     A floating dropdown would be clipped by the checkout scroll — this flows inline. -->
<div data-dz="grid"
    data-name="CheckoutCardView"
    class="dz-xy-0-0 dz-wh-100-1 dz-noptr dz-fit-v dz-cols-1 dz-rows-100 dz-gap-0">
  <!-- Cart row (Nasdara): name + "€ 5 each", − qty + stepper, line total; Line-2 rule below. -->
  <div data-dz="panel"
      data-name="checkoutMainRow"
      data-style="TXRowRule"
      class="dz-xy-0-0 dz-wh-100-80px dz-c-FE dz-noptr">
    <span data-dz="text"
        data-name="productName"
        data-bind="{{ product_name_text }}"
        class="dz-xy-24px-14px dz-wh-180px-26px dz-c-F2E9D8 dz-font-nbb-20 dz-noptr dz-exact-text dz-text-vc">
      Item Name
    </span>
    <span data-dz="text"
        data-name="productUnit"
        data-bind="{{ product_unit_text }}"
        class="dz-xy-24px-44px dz-wh-180px-21px dz-c-A39276 dz-font-nm-17 dz-noptr dz-exact-text dz-text-vc">
      € 5 each
    </span>
    <div data-dz="panel"
        data-name="qtyStepper"
        data-style="TXFrame"
        class="dz-xy-135px-0 dz-wh-110px-41px dz-align-cr dz-c-FE dz-noptr">
      <button data-dz="button"
          data-name="btnMinus"
          data-style="Empty"
          data-on-click="OnMinusClick"
          class="dz-xy-0-0 dz-wh-38px-41px dz-tc-FE">
        <img data-dz="image"
            data-name="btnMinusIcon"
            class="dz-xy-0-0 dz-wh-16px-16px dz-align-cc dz-c-C2B59C dz-noptr"
            data-image="set:traderx_icons image:minus"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
      </button>
      <span data-dz="text"
          data-name="productQty"
          data-bind="{{ product_quantity_text }}"
          class="dz-xy-38px-0 dz-wh-34px-41px dz-c-F2E9D8 dz-font-nm-18 dz-noptr dz-exact-text dz-text-center dz-text-vc">
        1
      </span>
      <button data-dz="button"
          data-name="btnPlus"
          data-style="Empty"
          data-on-click="OnPlusClick"
          class="dz-xy-72px-0 dz-wh-38px-41px dz-tc-FE">
        <img data-dz="image"
            data-name="btnPlusIcon"
            class="dz-xy-0-0 dz-wh-16px-16px dz-align-cc dz-c-C2B59C dz-noptr"
            data-image="set:traderx_icons image:add"
            data-image-mode="blend"
            data-image-src-alpha="1"
            data-image-stretch="stretch_w_h"/>
      </button>
    </div>
    <span data-dz="text"
        data-name="productPrice"
        data-bind="{{ product_price_text }}"
        class="dz-xy-24px-0 dz-wh-100px-80px dz-align-x-right dz-c-F2E9D8 dz-font-nm-19 dz-noptr dz-exact-text dz-text-vc dz-text-right">
      € 10
    </span>
    <button data-dz="button"
        data-name="removeBtn"
        data-style="Empty"
        data-on-click="OnRemoveClick"
        class="dz-xy-0-0 dz-wh-1px-1px dz-tc-FE dz-hidden"></button>
  </div>
  <!-- Full-width preset select bar (row 2). Shown only when the product has presets
       (CheckoutCardComponent.SetupPresetPicker); hidden -> row collapses, card stays compact.
       Value on the left, chevron on the right — reads as a select control. -->
  <button data-dz="button"
      data-name="presetToggleBtn"
      data-style="TXListRow"
      data-on-click="OnPresetToggle"
      class="dz-xy-0-0 dz-wh-100-30px dz-c-FE dz-hidden">
    <span data-dz="text"
        data-name="presetToggleLabel"
        data-bind="{{ preset_toggle_label }}"
        class="dz-xy-3-0 dz-wh-88-100 dz-c-D9762F dz-font-body-13 dz-noptr dz-bold dz-exact-text dz-text-vc">
      Presets
    </span>
    <img data-dz="image"
        data-name="presetChevron"
        class="dz-xy-93-0 dz-wh-18px-18px dz-align-y-center dz-c-A39276 dz-noptr"
        data-image="set:traderx_icons image:chevron_down"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <!-- Collapsible preset options (row 3) — one tx-checkout-preset-option per entry, same
       width as the select bar. Hidden until expanded; contributes no height when hidden. -->
  <div data-dz="grid"
      data-name="presetOptionsGrid"
      data-foreach="{{ _presetOptions }}"
      data-template="tx-checkout-preset-option"
      data-item="_inputOption"
      class="dz-xy-0-0 dz-wh-100-1 dz-noptr dz-fit-v dz-cols-1 dz-rows-100 dz-gap-2 dz-hidden"></div>
</div>

<script src="dzml-runtime.js?v=1780762085514"></script>
</body>
</html>
