<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="CheckoutCardView"
    data-style="blank"
    class="dz-xy-0-0 dz-wh-100-60px dz-c-FE dz-noptr">
  <span data-dz="text"
      data-name="productName"
      data-bind="{{ product_name_text }}"
      class="dz-xy-3-6 dz-wh-56-44 dz-c-D8D2C0 dz-font-body-14 dz-noptr dz-bold dz-exact-text dz-text-vc">
    Item Name
  </span>
  <span data-dz="text"
      data-name="productPrice"
      data-bind="{{ product_price_text }}"
      class="dz-xy-3-52 dz-wh-56-40 dz-c-C4A35A dz-font-mono-14 dz-noptr dz-exact-text dz-text-vc">
    1,250
  </span>
  <button data-dz="button"
      data-name="btnMinus"
      data-style="TXBtnIcon"
      data-on-click="OnMinusClick"
      class="dz-xy-60-0 dz-wh-32px-32px dz-align-y-center dz-tc-FE dz-tc-D8D2C0 dz-font-body-16">
    <img data-dz="image"
        data-name="btnMinusIcon"
        class="dz-xy-0-0 dz-wh-26px-26px dz-align-cc dz-noptr"
        data-image="set:traderx_icons image:minus"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <span data-dz="text"
      data-name="productQty"
      data-bind="{{ product_quantity_text }}"
      class="dz-xy-68-0 dz-wh-14-100 dz-c-D8D2C0 dz-font-mono-16 dz-noptr dz-bold dz-exact-text dz-text-center dz-text-vc">
    1
  </span>
  <button data-dz="button"
      data-name="btnPlus"
      data-style="TXBtnIcon"
      data-on-click="OnPlusClick"
      class="dz-xy-80-0 dz-wh-32px-32px dz-align-y-center dz-tc-FE dz-tc-D8D2C0 dz-font-body-16">
    <img data-dz="image"
        data-name="btnPlusIcon"
        class="dz-xy-0-0 dz-wh-26px-26px dz-align-cc dz-noptr"
        data-image="set:traderx_icons image:add"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
  <button data-dz="button"
      data-name="removeBtn"
      data-style="TXBtnIcon"
      data-on-click="OnRemoveClick"
      class="dz-xy-90-0 dz-wh-32px-32px dz-align-y-center dz-tc-FE dz-tc-C93030 dz-font-body-16">
    <img data-dz="image"
        data-name="removeBtnIcon"
        class="dz-xy-0-0 dz-wh-26px-26px dz-align-cc dz-c-F0654A dz-noptr"
        data-image="set:traderx_icons image:trash"
        data-image-mode="blend"
        data-image-src-alpha="1"
        data-image-stretch="stretch_w_h"/>
  </button>
</div>

<script src="dzml-runtime.js?v=1780762085514"></script>
</body>
</html>
