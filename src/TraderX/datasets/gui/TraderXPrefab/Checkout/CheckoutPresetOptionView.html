<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="presetOptionView"
    class="dz-xy-0-0 dz-wh-100-30px dz-noptr">
  <button data-dz="button"
      data-name="presetOptionBtn"
      data-style="TXListRow"
      data-on-click="OnOptionClick"
      class="dz-xy-0-0 dz-wh-full dz-tc-FE">
    <span data-dz="text"
        data-name="presetOptionLabel"
        data-bind="{{ option_label }}"
        class="dz-xy-6-0 dz-wh-90-100 dz-c-D8D2C0 dz-font-body-14 dz-noptr dz-exact-text dz-text-vc">
      Preset Name
    </span>
  </button>
</div>

<script src="dzml-runtime.js"></script>
</body>
</html>
