<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<div data-dz="panel"
    data-name="BuyTooltip"
    data-style="TXCardElevated"
    class="dz-xy-29.216px-30px dz-wh-420px-120px dz-c-FE dz-noptr dz-priority-999">
  <!-- Solid opaque fill so the description is legible over the list underneath.
       Plain panel (no data-style) keeps its dark dz-c fill instead of being tinted white. -->
  <div data-dz="panel"
      data-name="opaqueFill"
      class="dz-xy-0-0 dz-wh-full dz-c-0B0D12 dz-noptr dz-priority-999"></div>
  <div data-dz="panel"
      data-name="PanelWidget2"
      class="dz-xy-4-8 dz-wh-92-84 dz-noptr dz-priority-999">
    <span data-dz="text"
        data-name="TextWidget8"
        class="dz-xy-0-0 dz-wh-100-22 dz-align-x-center dz-tc-9ACD32 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
      #tpm_product_description
    </span>
    <p data-dz="richtext"
        data-name="RichTextWidget0"
        data-bind="{{ product_description }}"
        class="dz-xy-0-24 dz-wh-100-74 dz-align-x-center dz-c-D8D2C0 dz-noptr dz-wrap">
      Selective-fire assault rifle fed from a detachable magazine.
    </p>
  </div>
</div>

<script src="dzml-runtime.js?v=1780762090041"></script>
</body>
</html>
