<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="dzml.css">
  <link rel="stylesheet" href="dzml-styles.css">
  <link rel="stylesheet" href="dzml-icons.css">
</head>
<body data-dzml class="dz-viewport" style="width:1920px; height:1080px; background:#1a1a1a;">

<button data-dz="button"
    data-name="vehicleRowBtn"
    data-style="TXListRow"
    class="dz-xy-0-0 dz-wh-100-48px dz-tc-FE dz-tc-FE">
  <div data-dz="panel"
      data-name="vehicleRowContent"
      data-style="blank"
      class="dz-xy-0-0 dz-wh-full dz-align-cc dz-c-FE dz-noptr">
    <div data-dz="panel"
        data-name="healthIndicator"
        data-style="rover_sim_colorable"
        class="dz-xy-0-10 dz-wh-1-80 dz-c-FE dz-noptr"></div>
    <span data-dz="text"
        data-name="vehicleName"
        class="dz-xy-4-0 dz-wh-65-60 dz-tc-C0 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
      OffroadHatchback
    </span>
    <span data-dz="text"
        data-name="vehicleHealth"
        class="dz-xy-4-55 dz-wh-65-40 dz-tc-55 dz-font-body-16 dz-noptr dz-exact-text dz-text-vc">
      Pristine
    </span>
    <div data-dz="panel"
        data-name="blockingBadge"
        data-style="TXBadge"
        class="dz-xy-75-20 dz-wh-22-60 dz-c-FE dz-noptr dz-hidden">
      <span data-dz="text"
          data-name="blockingText"
          class="dz-xy-0-0 dz-wh-full dz-tc-C9302C dz-font-body-16 dz-noptr dz-exact-text dz-text-center dz-text-vc">
        IN
      </span>
    </div>
  </div>
</button>

<script src="dzml-runtime.js?v=1780762081476"></script>
</body>
</html>
