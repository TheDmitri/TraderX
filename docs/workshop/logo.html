<html><head><link rel=stylesheet href=logo.css><style>
body{position:relative;background:radial-gradient(circle at 50% 40%,#3a2214 0,#1a130e 45%,var(--bg) 75%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 50% 42%,#000 20%,transparent 70%)}
.emb{position:absolute;left:50%;top:140px;transform:translateX(-50%);width:360px;height:360px}
.word{position:absolute;top:540px;width:100%;text-align:center;font-family:Anton;font-size:190px;letter-spacing:6px;color:var(--cream);line-height:1}
.word b{color:var(--ember);font-weight:400}
.tag{position:absolute;top:770px;width:100%;text-align:center;font-family:Raj;font-weight:700;font-size:40px;letter-spacing:14px;color:var(--muted)}
.tag i{color:var(--ember);font-style:normal}
.bar{position:absolute;bottom:0;left:0;right:0;height:92px;background:#0c0a08cc;border-top:3px solid var(--ember);display:flex;align-items:center;justify-content:center;gap:28px;font-family:Mono;font-size:26px;color:var(--cream);letter-spacing:3px}
.bar span{color:var(--ember)}
</style></head><body><div class=grid></div>
<svg class=emb viewBox="0 0 360 360">
 <defs><linearGradient id=g x1=0 y1=0 x2=1 y2=1><stop offset=0 stop-color="#ff9a4a"/><stop offset=1 stop-color="#c85a1c"/></linearGradient></defs>
 <polygon points="180,10 335,95 335,265 180,350 25,265 25,95" fill="#1c1713" stroke="#3a2f26" stroke-width="6"/>
 <polygon points="180,34 314,108 314,252 180,326 46,252 46,108" fill="none" stroke="url(#g)" stroke-width="5"/>
 <path d="M112 106 L248 254" stroke="url(#g)" stroke-width="44" stroke-linecap="square"/>
 <path d="M248 106 L112 254" stroke="#f1e7d9" stroke-width="44" stroke-linecap="square"/>
 <circle cx="180" cy="180" r="18" fill="#120f0c" stroke="url(#g)" stroke-width="6"/>
</svg>
<div class=word>TRADER<b>X</b></div>
<div class=tag>TRADE <i>·</i> BANK <i>·</i> GARAGE</div>
<div class=bar>DAYZ 1.30 <span>/</span> CF ONLY <span>/</span> TRADERPLUS IMPORT</div>
<div class=noise></div></body></html>
